# Production publishes the AI consulting portfolio in sarahi-site/.
# The previous Clara demo is preserved in public/ and netlify/functions/ (and on branch archive/demo-13-empresas).
[build]
  base = "sarahi-site"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
