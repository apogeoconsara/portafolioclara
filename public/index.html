<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clara Growth &amp; Lifecycle Agent</title>
<style>
/* Design tokens ---------------------------------------------------------
   Fintech B2B LatAm feel: cool blue/teal on a clean, near-white ground —
   not a verified reproduction of Clara's real brand (no access to their
   brand kit), just a professional fintech-adjacent palette. Dense data
   tables + a fixed left rail, read as an internal growth ops console.
------------------------------------------------------------------------- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --ink: #F5F7FB;
  --panel: #FFFFFF;
  --panel-2: #EEF1F7;
  --line: #DFE4EE;
  --text: #10182B;
  --muted: #64708A;
  --accent: #2F5DF4;
  --accent-dim: #E7ECFE;
  --teal: #12977C;
  --tier-a: #12977C;
  --tier-b: #B4740E;
  --tier-c: #7A8296;
  --good: #16A34A;
  --warn: #B4740E;
  --bad: #DC2626;
  --rail-bg: #0D1B3D;
  --rail-bg-2: #16295C;
  --rail-text: #F1F4FC;
  --rail-muted: #9AA9D6;
  --rail-line: rgba(255,255,255,.08);
  --font-head: 'Inter', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* --- Rail --- */
.rail {
  width: 240px; flex-shrink: 0; background: var(--rail-bg);
  border-right: 1px solid var(--rail-line); padding: 22px 16px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.rail-brand { font-family: var(--font-head); font-weight: 700; font-size: 16px; color: var(--rail-text); margin-bottom: 2px; }
.rail-sub { color: var(--rail-muted); font-size: 12px; margin-bottom: 14px; }
.rail-badge {
  display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1);
  color: #7BE0C4; font-size: 11px; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px;
}
.rail-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7BE0C4; }
.rail-badge.live { color: #8FC0FF; }
.rail-badge.live::before { background: #8FC0FF; }
.rail nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.rail-group-label { color: var(--rail-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 10px 4px; }
.rail nav button {
  all: unset; cursor: pointer; color: var(--rail-muted); font-size: 13.5px; font-weight: 500;
  padding: 9px 10px; border-radius: 6px; display: flex; align-items: center; gap: 9px;
}
.rail nav button:hover { background: var(--rail-bg-2); color: var(--rail-text); }
.rail nav button.active { background: var(--rail-bg-2); color: var(--rail-text); box-shadow: inset 3px 0 0 var(--accent); }
.rail nav button .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }

/* --- Main --- */
.main { flex: 1; min-width: 0; padding: 30px 40px 60px; max-width: 1180px; }
.page-head { margin-bottom: 24px; }
.page-head h1 { font-family: var(--font-head); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
.page-head p { color: var(--muted); margin: 0; max-width: 700px; }

/* --- KPI grid --- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px 14px; }
.kpi .v { font-family: var(--font-head); font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; margin-top: 4px; }
.kpi .v.tier-a { color: var(--tier-a); }
.kpi .v.tier-b { color: var(--tier-b); }
.kpi .v.tier-c { color: var(--tier-c); }

/* --- Panels / tables --- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
.panel-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-family: var(--font-head); font-size: 14.5px; margin: 0; font-weight: 600; }
.panel-head .hint { color: var(--muted); font-size: 12px; }
.panel-body { padding: 14px 16px; }
.grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2,1fr); } }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 16px; border-bottom: 1px solid var(--line); }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: var(--panel-2); }

.tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; font-size: 11.5px; font-weight: 600; }
.tag.tier-a { color: var(--tier-a); border-color: rgba(18,151,124,.35); background: rgba(18,151,124,.08); }
.tag.tier-b { color: var(--tier-b); border-color: rgba(180,116,14,.35); background: rgba(180,116,14,.08); }
.tag.tier-c { color: var(--tier-c); border-color: rgba(122,130,150,.35); background: rgba(122,130,150,.08); }

.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 6px; }
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: #FCE9E9; color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.field-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--muted); }
.field-row .val { text-align: right; font-weight: 500; }

.status-note { padding: 10px 14px; border-radius: 6px; font-size: 12.5px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); margin-bottom: 14px; }
.status-note.err { background: #FCE9E9; color: #8A1F1F; border-color: rgba(220,38,38,.3); }
.status-note.ok { background: #E7F7EF; color: #0F5132; border-color: rgba(22,163,74,.3); }

.trace { list-style: none; margin: 0; padding: 0; }
.trace li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trace li:last-child { border-bottom: none; }
.trace .step-badge { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.trace .step-body b { display: block; font-size: 13px; }
.trace .step-body span { color: var(--muted); font-size: 12.5px; }
.trace .step-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-weight: 700; }

.slider-row { margin-bottom: 14px; }
.slider-row label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.slider-row label b { color: var(--text); font-weight: 600; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }

.msg-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap; }

.arch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.arch-grid > div { padding: 14px 16px; }
.arch-grid > div:first-child { border-right: 1px solid var(--line); }
@media (max-width: 900px) { .arch-grid { grid-template-columns: 1fr; } .arch-grid > div:first-child { border-right: none; border-bottom: 1px solid var(--line); } }
.arch-row { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; align-items: flex-start; }
.arch-row .ic { flex-shrink: 0; }

/* --- Chat --- */
.chat-wrap { display: flex; flex-direction: column; height: 560px; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.chat-msg { max-width: 78%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; }
.chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
.chat-msg.agent { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.chat-msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; }
.chat-approval { align-self: flex-start; max-width: 90%; background: #FFF8E6; border: 1px solid #F0D585; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat-input-row input { flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); font-size: 13.5px; font-family: inherit; }
.typing-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin: 0 1px; animation: blink 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: .2s; } .typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

.bar-track { background: var(--panel-2); border-radius: 4px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }

/* --- Growth Workflow (n8n → HubSpot) — usa los mismos tokens, sin colores nuevos de marca --- */
.wf-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.wf-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); }
.wf-pill.running { color: var(--accent); border-color: rgba(47,93,244,.35); background: var(--accent-dim); }
.wf-pill.completed { color: var(--good); border-color: rgba(22,163,74,.35); background: #E7F7EF; }
.wf-pill.error { color: var(--bad); border-color: rgba(220,38,38,.35); background: #FCE9E9; }
.wf-pill.live { color: var(--teal); border-color: rgba(18,151,124,.4); background: rgba(18,151,124,.08); }
.wf-pill.demo { color: var(--warn); border-color: rgba(180,116,14,.4); background: rgba(180,116,14,.09); }
.wf-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.wf-step { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.wf-step.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); animation: wfpulse 1.1s infinite; }
.wf-step.ok { color: var(--good); border-color: rgba(22,163,74,.35); background: #E7F7EF; }
.wf-step.warn { color: var(--warn); border-color: rgba(180,116,14,.4); background: rgba(180,116,14,.09); }
.wf-step.error { color: var(--bad); border-color: rgba(220,38,38,.35); background: #FCE9E9; }
.wf-step.skipped { color: var(--tier-c); border-style: dashed; }
@keyframes wfpulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
.wf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.wf-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--panel); min-width: 0; }
.wf-card.wide { grid-column: 1 / -1; }
.wf-card h3 { margin: 0 0 6px; font-family: var(--font-head); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.wf-card p { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.wf-card .field-row .val.pts { white-space: nowrap; }
.wf-score { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.wf-score .big { font-family: var(--font-head); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wf-score .of { color: var(--muted); font-size: 13px; }
.route-pill { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--line); }
.route-pill.nurture { color: var(--tier-c); background: rgba(122,130,150,.1); border-color: rgba(122,130,150,.35); }
.route-pill.sdr { color: var(--tier-b); background: rgba(180,116,14,.09); border-color: rgba(180,116,14,.35); }
.route-pill.ae { color: var(--tier-a); background: rgba(18,151,124,.09); border-color: rgba(18,151,124,.35); }
.route-pill.outbound { color: var(--accent); background: var(--accent-dim); border-color: rgba(47,93,244,.35); }
.route-pill.review { color: var(--bad); background: #FCE9E9; border-color: rgba(220,38,38,.3); }
.wf-rules { margin: 8px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.wf-callout { border: 1px dashed var(--accent); background: var(--accent-dim); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-top: 12px; }
.wf-callout b { color: var(--accent); }
.wf-review { border-top: 1px solid var(--line); padding-top: 12px; }
.wf-review h3 { margin: 0 0 4px; font-family: var(--font-head); font-size: 13px; }
.wf-small { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.wf-tl { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.wf-tl li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.wf-tl li:last-child { border-bottom: none; }
.wf-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--tier-c); }
.wf-dot.ok { background: var(--good); } .wf-dot.warn { background: var(--warn); } .wf-dot.error { background: var(--bad); } .wf-dot.pending { background: var(--accent); }
.wf-tl .t { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
details.wf-run { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--panel); }
details.wf-run > summary { cursor: pointer; padding: 10px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
details.wf-run > .wf-tl { padding: 0 14px 10px; }
.route-lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.route-lane { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); min-width: 0; }
.route-lane h3 { margin: 0 0 2px; font-size: 13px; font-family: var(--font-head); }
.route-lane .rule { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }
.route-lane .lead-chip { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 8px; margin-bottom: 5px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text); }
.route-lane .lead-chip:hover { border-color: var(--accent); }
.route-lane .empty { color: var(--muted); font-size: 12px; }
.sys-flow { display: flex; flex-direction: column; align-items: stretch; max-width: 760px; }
.sys-node { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
.sys-node .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sys-node b { display: block; font-size: 13.5px; }
.sys-node span.d { color: var(--muted); font-size: 12.5px; }
.sys-node.future { border-style: dashed; background: var(--panel-2); }
.sys-arrow { text-align: center; color: var(--muted); font-size: 14px; line-height: 1; padding: 3px 0; }
@media (max-width: 980px) { .route-lanes { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) {
  .wf-grid { grid-template-columns: 1fr; }
  .route-lanes { grid-template-columns: 1fr; }
  .sys-node { grid-template-columns: 28px 1fr; }
  .sys-node .tag { grid-column: 2; justify-self: start; }
}

@media (max-width: 720px) {
  .app { flex-direction: column; }
  .rail { width: 100%; height: auto; position: static; }
  .main { padding: 18px; }
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="rail-brand">Clara Growth Agent</div>
    <div class="rail-sub">Growth &amp; Lifecycle — Demo</div>
    <div class="rail-badge">Empresas reales · portafolio, no una campaña activa</div>
    <div id="ai-mode-badge"></div>
    <div id="wf-mode-badge"></div>
    <nav id="rail-nav">
      <button data-page="agent"><span class="dot"></span>Agente Clara (chat)</button>
      <div class="rail-group-label">Pipeline</div>
      <button data-page="pipeline"><span class="dot"></span>Pipeline &amp; Routing</button>
      <button data-page="leads"><span class="dot"></span>Leads</button>
      <div class="rail-group-label">Dashboard</div>
      <button data-page="lifecycle"><span class="dot"></span>Lifecycle Performance</button>
      <button data-page="economics"><span class="dot"></span>Growth Economics</button>
      <button data-page="activity"><span class="dot"></span>Agent Activity Log</button>
      <div class="rail-group-label">Sistema</div>
      <button data-page="config"><span class="dot"></span>Reglas de scoring</button>
      <button data-page="architecture"><span class="dot"></span>Arquitectura</button>
    </nav>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* =========================================================================
   Clara Growth & Lifecycle Agent — demo client-side app.
   Todo el pipeline (intake → scoring → gate → routing → lifecycle →
   dashboard) corre en el navegador. Los únicos backends reales son las
   Netlify Functions bajo netlify/functions/, usadas solo cuando el
   visitante pide explícitamente "razonamiento en vivo (OpenAI)" en el
   detalle de un lead, o abre el chat del Agente Clara (Anthropic).
   ========================================================================= */

/* ---------------------------------------------------------------- CONFIG */
// Pesos y umbrales editables en vivo desde la página "Reglas de scoring".
// Los valores por defecto coinciden EXACTAMENTE con
// netlify/functions/_clara_agent_shared.mjs (calcularScore) — ver la nota
// "FALLBACK_LEADS / scoreLead" más abajo sobre por qué la fórmula se
// reimplementa aquí en vez de importarse directamente.
const CONFIG = {
  pesos: { tamano: 30, dolor: 25, senales: 15 /* por señal, tope 3 señales = 45 */ },
  tamano_min: 20, tamano_max: 1500,
  umbral_a: 75, umbral_b: 50,
};
const DEFAULT_CONFIG = JSON.parse(JSON.stringify(CONFIG));

/* ---------------------------------------------------------------- DATASET
   Copia local de respaldo — mismo contenido que
   netlify/functions/_clara_agent_shared.mjs — usada solo si el fetch a
   /.netlify/functions/leads-data falla (por ejemplo abriendo este archivo
   directamente desde el disco, sin `netlify dev` ni un deploy real). Cuando
   el fetch SÍ funciona, los datos de ambos vienen del mismo módulo servidor,
   así que el dashboard y el chat del Agente Clara nunca pueden divergir en
   los hechos de un lead — solo la fórmula de score se reimplementa aquí
   (no hay build step en este proyecto para compartir código JS entre el
   navegador y una Netlify Function), y se mantiene deliberadamente idéntica
   línea por línea a calcularScore() del lado del servidor.

   Procedencia de los datos: estas 13 empresas son reales, investigadas con
   Clay a partir de sus propios perfiles corporativos/LinkedIn públicos (ver
   el comentario completo en _clara_agent_shared.mjs). senales_compra son
   hechos públicos citados de esos perfiles; dolor_actual es una hipótesis
   de dolor operativo que el agente infiere a partir de esas señales, no un
   hecho confirmado por la empresa. No se incluye ningún dato de contacto
   individual (nombre/email de una persona) — solo evidencia a nivel de
   empresa. Ninguna de estas empresas fue contactada; esto es un ejercicio
   de portafolio, no una campaña activa de Clara. */
const FALLBACK_LEADS = [
  { nombre: "Apiux Tech", industria: "Consultoría TI / Transformación Digital", empleados: 305, pais: "Chile", fuente: "Investigación Clay (perfil corporativo público)",
    dolor_actual: ["coordina equipos y proveedores en 5 países (Chile, Colombia, Perú, España, EE.UU.) y creció por adquisición de otras empresas (Nectia, Backspace) — perfil típico de pagos entre entidades gestionados de forma manual, sin evidencia pública de tesorería centralizada"],

/* ---------------------------------------------------------- SCORING (JS)
   Mismo algoritmo que calcularScore() en _clara_agent_shared.mjs, pero
   parametrizado por CONFIG para que el panel de "Reglas de scoring" pueda
   recalcular todos los leads en vivo sin volver a llamar al servidor. */
function puntajeTamano(empleados) {
  if (empleados >= CONFIG.tamano_min && empleados <= CONFIG.tamano_max) {
    return [CONFIG.pesos.tamano, `tamaño ideal para el ICP de Clara (${empleados} empleados)`];
  }
  return [5, `fuera del rango ideal de tamaño (${empleados} empleados)`];
}
function puntajeDolor(dolorActual) {
  const texto = dolorActual.join(" ").toLowerCase();
  const dolorAlto = ["manual", "papel", "sin tarjetas corporativas", "sin consolidar", "sin conciliación", "sin tesorería centralizada"];
  const dolorBajo = ["ya usa una plataforma de gasto corporativo", "ya usa tarjetas corporativas"];
  if (dolorBajo.some(k => texto.includes(k))) return [Math.round(CONFIG.pesos.dolor * 0.2), "ya usa una solución de gasto/tesorería (dolor bajo)"];
  if (dolorAlto.some(k => texto.includes(k))) return [CONFIG.pesos.dolor, "procesos de pago/tesorería manuales o sin consolidar (dolor alto)"];
  return [Math.round(CONFIG.pesos.dolor * 0.5), "dolor no clasificado, se asume dolor medio"];
}
function scoreLead(lead) {
  const razones = [];
  const [ptsTamano, motivoTamano] = puntajeTamano(lead.empleados);
  razones.push(`${motivoTamano}: +${ptsTamano}`);
  const [ptsDolor, motivoDolor] = puntajeDolor(lead.dolor_actual);
  razones.push(`${motivoDolor}: +${ptsDolor}`);
  const numSenales = lead.senales_compra.length;
  const ptsSenales = Math.min(numSenales * CONFIG.pesos.senales, CONFIG.pesos.senales * 3);
  razones.push(`${numSenales} señal(es) de compra activa(s): +${ptsSenales}`);
  const score = ptsTamano + ptsDolor + ptsSenales;
  let tier, ruteo;
  if (score >= CONFIG.umbral_a) { tier = "A"; ruteo = "Handoff a AE (SDR humano)"; }
  else if (score >= CONFIG.umbral_b) { tier = "B"; ruteo = "Lifecycle automatizado (nurture)"; }
  else { tier = "C"; ruteo = "Suprimir (no calificado)"; }
  return { score, tier, ruteo, razon: razones.join("; ") };
}
function recomputeAllScores() {
  LEADS.forEach(l => Object.assign(l, scoreLead(l)));
}

/* -------------------------------------------------------------- helpers */
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { const d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
function idFor(nombre) { return nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function fmtUsd(n) { return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 }); }
function seededRandom(seedStr) {
  let h = 0; for (let i = 0; i < seedStr.length; i++) { h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
  return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return (h % 1000) / 1000; };
}

/* ---------------------------------------------------------------- INIT */
async function init() {
  try {
    const res = await fetch("/.netlify/functions/leads-data");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    LEADS = data.leads.map(l => ({ ...l, id: idFor(l.nombre) }));
    DATA_SOURCE = "netlify_function";
  } catch (err) {
    LEADS = FALLBACK_LEADS.map(l => ({ ...l, id: idFor(l.nombre) }));
    DATA_SOURCE = "local_fallback";
  }
  recomputeAllScores();
  buildSimulatedLifecycle();
  document.querySelectorAll(".rail nav button").forEach(b => {
    b.addEventListener("click", () => goTo(b.dataset.page));
  });
  render();
  loadIntegrationStatus();
}

// Eventos de lifecycle 100% ficticios/derivados, generados de forma
// determinística (semilla = nombre del lead) para que el dashboard de
// "Lifecycle Performance" tenga algo que mostrar sin necesitar un backend
// con eventos reales de verdad — nunca se presentan como datos medidos.
function buildSimulatedLifecycle() {
  SIM_EVENTS = [];
  const canales = ["email", "whatsapp", "push"];
  const etapas = ["onboarding", "activacion", "retencion"];
  LEADS.forEach(l => {
    const rnd = seededRandom(l.nombre);
    if (l.tier === "C") return; // suprimidos no entran a lifecycle
    const nEventos = l.tier === "A" ? 4 : 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < nEventos; i++) {
      const canal = canales[Math.floor(rnd() * canales.length)];
      const etapa = etapas[Math.floor(rnd() * etapas.length)];
      const tipos = ["abrio_mensaje", "respondio", "agendo_reunion", "activo_producto", "riesgo_churn"];
      const tipo = tipos[Math.floor(rnd() * tipos.length)];
      SIM_EVENTS.push({ lead: l.nombre, tier: l.tier, canal, etapa, tipo, dias_desde_ingreso: Math.floor(rnd() * 30) });
    }
  });
}

/* --------------------------------------------------------- LEAD DETAIL / AGENT RUN */
function templateOutreach(l) {
  if (l.tier === "C") return { asunto: "(sin acción — ajuste insuficiente)", mensaje: "No aplica: lead descartado por bajo ajuste a ICP." };
  const dolor = l.dolor_actual[0] || "procesos de pago manuales";
  const senal = l.senales_compra[0];
  const asunto = l.tier === "A" ? `${l.nombre.split(" ")[0]} + Clara: pagos internacionales sin fricción` : `Una idea para ${l.nombre.split(" ")[0]} sobre pagos y tarjetas corporativas`;
  const aperturaSenal = senal ? `Vi que ${senal.toLowerCase()}.` : `Vi que su equipo está creciendo en la región.`;
  const mensaje = `Hola equipo de ${l.nombre} —\n\n${aperturaSenal} En Clara ayudamos a empresas como ${l.nombre} a resolver justo ${dolor} con tarjetas corporativas y pagos internacionales en una sola plataforma.\n\nPara un equipo del tamaño de ${l.nombre} (${l.empleados.toLocaleString()} personas), esto normalmente significa menos horas de conciliación manual, mejor visibilidad de gasto por área y pagos a proveedores en el extranjero sin depender de transferencias bancarias tradicionales.\n\n¿Tienen 20 minutos esta semana para ver si aplica a su caso?`;
  return { asunto, mensaje };
}
function buildAgentRun(l) {
  const gate = l.tier !== "C";
  const live = LIVE_REASONING[l.id];
  const outreach = live ? live.reasoning.outreach : templateOutreach(l);
  return [
    { tag: "ENGINE", title: "Intake del lead", detail: `Empresa incorporada al dataset a partir de investigación pública (${l.fuente}). Se normalizan los campos y se guarda con estado "nuevo".` },
    { tag: "ENGINE", title: "Scoring determinístico", detail: `Score calculado: ${l.score}/100. ${l.razon}.` },
    { tag: "GATE", title: "Gate de calificación", detail: gate ? `Score ${l.score} ≥ umbral (${CONFIG.umbral_b}) → pasa el gate, se justifica invertir cómputo de IA y atención de un SDR/AE.` : `Score ${l.score} < umbral (${CONFIG.umbral_b}) → no pasa el gate, se suprime sin gastar más cómputo ni tiempo de venta.` },
    { tag: "AGENT", title: live ? `Razonamiento de IA (${llmName(live)}, en vivo)` : "Razonamiento de IA (simulado)", detail: gate ? (live ? live.reasoning.resumen_calificacion : `Resumen determinístico: ${l.nombre} encaja con el ICP por tamaño (${l.empleados} empleados) y ${l.senales_compra.length} señal(es) de compra. INFERENCIA: el dolor citado sugiere fricción operativa en pagos, no confirmado directamente por el lead.`) : "No aplica — el lead fue suprimido antes de este paso." },
    { tag: "AGENT", title: "Generación de outreach", detail: gate ? `Asunto: "${outreach.asunto || outreach.mensaje}"` : "No aplica — suprimido." },
    { tag: "ENGINE", title: "Decisión de routing", detail: `${l.ruteo}. Esta decisión es 100% determinística (script de arriba) — la IA nunca decide el score ni el tier, solo redacta y explica.` },
  ];
}

  });

  l.razon.split("; ").forEach(r => breakdown.appendChild(el(`<div class="field-row"><span class="val">${esc(r)}</span></div>`)));
  breakdown.appendChild(el(`<div class="field-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span class="k"><b>Total</b></span><span class="val"><b>${l.score}/100 — Tier ${l.tier}</b></span></div>`));

  wrap.querySelector("#run-live").addEventListener("click", async () => {
    const btn = wrap.querySelector("#run-live");
    const status = wrap.querySelector("#live-status");
    btn.disabled = true;
    status.innerHTML = "";
    status.appendChild(el(`<div class="status-note">Llamando al modelo (Claude)…</div>`));
    try {
      const startedAt = Date.now();
      const res = await fetch("/.netlify/functions/lead-reasoning", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ nombre: l.nombre }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      LIVE_REASONING[id] = data;
      AI_SPEND.total_usd += data.meta.estimated_cost_usd;
      AI_SPEND.calls += 1;
      CALL_LOG.push({ ts: new Date().toISOString(), system: "LLM (lead-reasoning)", lead: l.nombre, status: "ok", latency_ms: data.meta.latency_ms });
      status.innerHTML = "";
      status.appendChild(el(`<div class="status-note ok">Listo — ${data.meta.total_tokens} tokens, ${data.meta.latency_ms}ms, costo estimado ${data.meta.estimated_cost_usd.toFixed(6)} USD.</div>`));
      render();
    } catch (err) {
      CALL_LOG.push({ ts: new Date().toISOString(), system: "LLM (lead-reasoning)", lead: l.nombre, status: "error", detail: String(err.message || err) });
      status.innerHTML = "";
      status.appendChild(el(`<div class="status-note err">No se pudo ejecutar el razonamiento en vivo — el panel se queda con la simulación determinística.</div>`));
      btn.disabled = false;
    }
  });

  wrap.querySelector("#propose-crm").addEventListener("click", async () => {
    const status = wrap.querySelector("#crm-status");
    status.innerHTML = "";
    status.appendChild(el(`<div class="status-note">Enviando propuesta a confirm-crm-action…</div>`));
    try {
      const res = await fetch("/.netlify/functions/confirm-crm-action", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: { nombre: l.nombre, ruteo: l.ruteo } }),
      });

      status.innerHTML = "";
      status.appendChild(el(`<div class="status-note ok">${esc(data.message || "")}</div>`));
    } catch (err) {
      status.innerHTML = "";
      status.appendChild(el(`<div class="status-note err">No se pudo contactar la función (${esc(String(err.message || err))}).</div>`));
    }
  });

  return wrap;
}

/* --------------------------------------------------------- 3. LIFECYCLE PERFORMANCE */
function renderLifecycle() {
  const inLifecycle = LEADS.filter(l => l.tier !== "C");
  const byCanal = { email: 0, whatsapp: 0, push: 0 };
  const byEtapa = { onboarding: 0, activacion: 0, retencion: 0 };
  let activaciones = 0, riesgos = 0;
  SIM_EVENTS.forEach(e => {
    byCanal[e.canal] = (byCanal[e.canal]||0) + 1;
    byEtapa[e.etapa] = (byEtapa[e.etapa]||0) + 1;
    if (e.tipo === "activo_producto") activaciones++;
    if (e.tipo === "riesgo_churn") riesgos++;
  });
  const activationRate = inLifecycle.length ? Math.round((activaciones / inLifecycle.length) * 100) : 0;
  const avgDiasActivacion = Math.round(SIM_EVENTS.filter(e=>e.tipo==="activo_producto").reduce((s,e)=>s+e.dias_desde_ingreso,0) / Math.max(1, activaciones));

  const wrap = el(`<div>
    <div class="page-head"><h1>Lifecycle Performance</h1><p>Onboarding, activación y retención de los leads que entraron al motor de lifecycle (Tier B) — eventos ilustrativos, generados de forma determinística a partir del dataset, no mediciones de un producto real en uso.</p></div>
    <div class="status-note">Estos eventos son una simulación etiquetada como tal — no provienen de envíos reales de email/WhatsApp/push. Sirven para mostrar la forma del dashboard, no un resultado medido.</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="v">${inLifecycle.length}</div><div class="l">Leads en lifecycle</div></div>
      <div class="kpi"><div class="v">${activationRate}%</div><div class="l">Activation rate (estimado)</div></div>
      <div class="kpi"><div class="v">${isFinite(avgDiasActivacion)?avgDiasActivacion:"—"}</div><div class="l">Días promedio a activación</div></div>
      <div class="kpi"><div class="v">${riesgos}</div><div class="l">Eventos de riesgo de churn</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Engagement por canal</h2></div>
        <div class="panel-body" id="canal-bars"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Eventos por etapa</h2></div>
        <div class="panel-body" id="etapa-bars"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Feed de eventos (muestra)</h2></div>
      <table><thead><tr><th>Lead</th><th>Etapa</th><th>Canal</th><th>Evento</th><th>Días desde ingreso</th></tr></thead>
      <tbody id="event-rows"></tbody></table>
    </div>
  </div>`);

  const maxCanal = Math.max(1, ...Object.values(byCanal));
  const canalWrap = wrap.querySelector("#canal-bars");
  Object.entries(byCanal).forEach(([canal, n]) => canalWrap.appendChild(el(`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(canal)}</span><b>${n}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxCanal*100)}%;background:var(--teal)"></div></div>
  </div>`)));

  const maxEtapa = Math.max(1, ...Object.values(byEtapa));
  const etapaWrap = wrap.querySelector("#etapa-bars");
  Object.entries(byEtapa).forEach(([etapa, n]) => etapaWrap.appendChild(el(`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(etapa)}</span><b>${n}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxEtapa*100)}%;background:var(--accent)"></div></div>
  </div>`)));

  const rows = wrap.querySelector("#event-rows");
  SIM_EVENTS.slice(0, 20).forEach(e => rows.appendChild(el(`<tr>
    <td>${esc(e.lead)}</td><td>${esc(e.etapa)}</td><td>${esc(e.canal)}</td><td>${esc(e.tipo)}</td><td>${e.dias_desde_ingreso}</td>

  return wrap;

/* ------------------------------------------------------------- 4. GROWTH ECONOMICS */
function renderEconomics() {
  // Todos los montos son ILUSTRATIVOS (estimaciones definidas en el código
  // de este demo), no cifras financieras reales de Clara — aunque las
  // empresas del dataset sí son reales, ver _clara_agent_shared.mjs.
  const DEAL_VALUE_A = 18000, DEAL_VALUE_B = 6000; // valor de deal anualizado ilustrativo (USD)
  const COST_PER_LEAD = 42; // costo ilustrativo de calificar un lead (cómputo + herramientas)

  const pipelineGenerado = tierA.length * DEAL_VALUE_A + tierB.length * DEAL_VALUE_B * 0.3; // B pesa menos, aún no calificado por AE
  const costoTotal = LEADS.length * COST_PER_LEAD + AI_SPEND.total_usd;

  const wrap = el(`<div>

    <div class="status-note">Ninguna cifra de esta página es un dato financiero real. "Pipeline generado" y "CAC payback" usan un valor de deal y un costo por lead ilustrativos, definidos arriba en el código — cámbialos y todo el dashboard se recalcula.</div>

      <div class="kpi"><div class="v">${AI_SPEND.total_usd.toFixed(4)}</div><div class="l">Gasto real de IA esta sesión (USD)</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Supuestos usados en este cálculo</h2></div>
      <div class="panel-body">
        <div class="field-row"><span class="k">Valor de deal ilustrativo — Tier A</span><span class="val">${fmtUsd(DEAL_VALUE_A)} / año</span></div>
        <div class="field-row"><span class="k">Valor de deal ilustrativo — Tier B (ponderado 30%, aún sin calificar por AE)</span><span class="val">${fmtUsd(DEAL_VALUE_B)} / año</span></div>
        <div class="field-row"><span class="k">Costo ilustrativo por lead calificado</span><span class="val">${fmtUsd(COST_PER_LEAD)}</span></div>
        <div class="field-row"><span class="k">Gasto real de IA (LLM, esta sesión)</span><span class="val">${AI_SPEND.total_usd.toFixed(6)} USD en ${AI_SPEND.calls} llamada(s)</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Pipeline por tier</h2></div>
      <table><thead><tr><th>Tier</th><th>Leads</th><th>Valor de deal (c/u, ilustrativo)</th><th>Contribución al pipeline</th></tr></thead>
      <tbody>
        <tr><td><span class="tag tier-a">A</span></td><td>${tierA.length}</td><td>${fmtUsd(DEAL_VALUE_A)}</td><td>${fmtUsd(tierA.length*DEAL_VALUE_A)}</td></tr>
        <tr><td><span class="tag tier-b">B</span></td><td>${tierB.length}</td><td>${fmtUsd(DEAL_VALUE_B*0.3)} (ponderado)</td><td>${fmtUsd(tierB.length*DEAL_VALUE_B*0.3)}</td></tr>
      </tbody></table>
    </div>
  </div>`);
  return wrap;
}

      <tbody id="config-preview"></tbody></table>

  function bind(rangeId, labelId, configPath, isFloat) {
    const input = wrap.querySelector("#" + rangeId);

      const v = Number(input.value);

      recomputeAllScores();

  bind("r-dolor","v-dolor",["pesos","dolor"]);
  bind("r-senales","v-senales",["pesos","senales"]);
  bind("r-a","v-a",["umbral_a"]);
  bind("r-b","v-b",["umbral_b"]);
  bind("r-min","v-min",["tamano_min"]);
  bind("r-max","v-max",["tamano_max"]);

  wrap.querySelector("#reset-config").addEventListener("click", () => {
    Object.assign(CONFIG, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
    recomputeAllScores();
    render();

  function refreshPreview() {

  refreshPreview();
  return wrap;
}

/* ========================================================= 9. GROWTH WORKFLOW (n8n → HubSpot)
   Principio: el navegador NO contiene la lógica de negocio del workflow real.
     - Modo LIVE: manda el nombre del prospecto a /.netlify/functions/analyze-prospect,
       que lo reenvía al webhook de n8n (orquestador). n8n consulta HubSpot, calcula
       el score determinístico, llama al LLM solo si el lead califica, decide la ruta y
       actualiza HubSpot. Aquí solo se MUESTRA el resultado ya validado.
     - Modo DEMO: simulación local, SIEMPRE etiquetada como tal (nunca se presenta
       como una llamada real). Reusa scoreLead()/CONFIG de este archivo; sus reglas de
       routing (wfDecideRoute) son un espejo de las del nodo "Routing decision" del
       workflow de n8n (docs/n8n/clara-growth-agent.workflow.json).
   Nada de esto envía mensajes ni contacta a ninguna empresa. */
const INTEGRATION = { loaded: false, backend: true, n8nConfigured: false, n8nAuth: false, writeback: false, llmConfigured: false };
const WF = {};        // leadId -> estado de la última ejecución
const WF_RUNS = [];   // todas las ejecuciones de esta sesión (para el Activity Log)
let WF_SEQ = 0;

const WF_STAGES = [
  { id: "crm_context", label: "Fetching CRM context" },
  { id: "scoring", label: "Scoring" },
  { id: "ai_analysis", label: "AI analysis" },
  { id: "routing", label: "Routing decision" },
  { id: "crm_update", label: "Updating CRM" },
];
const ROUTE_META = {
  NURTURE: { label: "Nurture", cls: "nurture" },
  SDR_REVIEW: { label: "SDR Review", cls: "sdr" },
  AE_READY: { label: "AE Ready", cls: "ae" },
  OUTBOUND_READY: { label: "Outbound Ready", cls: "outbound" },
  NEEDS_REVIEW: { label: "Needs Review", cls: "review" },
};
const DECISION_META = {
  approve: { label: "Approved" },
  needs_review: { label: "Marked Needs Review", route: "NEEDS_REVIEW" },
  nurture: { label: "Sent to Nurture", route: "NURTURE" },
  ae_ready: { label: "Marked AE Ready", route: "AE_READY" },
  outbound_ready: { label: "Marked Outbound Ready", route: "OUTBOUND_READY" },
};
const WF_ERRORS = {
  N8N_NOT_CONFIGURED: ["n8n is not configured", "Set N8N_WEBHOOK_URL in the Netlify environment variables. Until then, use the demo simulation."],
  N8N_UNREACHABLE: ["n8n is unavailable", "The webhook could not be reached. Check that the n8n instance is up."],
  N8N_TIMEOUT: ["n8n timed out", "The workflow did not answer in time (HubSpot or the LLM may be slow). Retry, or use the demo simulation."],
  N8N_AUTH_FAILED: ["n8n rejected the request", "The shared secret does not match. Check N8N_WEBHOOK_SECRET and the webhook's Header Auth credential."],
  N8N_WORKFLOW_NOT_FOUND: ["Workflow not active in n8n", "n8n has no active webhook at that URL. Publish the workflow and use its Production URL."],
  N8N_HTTP_ERROR: ["n8n returned an error", "The workflow failed before it could answer. Open the execution in n8n for details."],

  INVALID_REQUEST: ["Invalid request", "The request was rejected before reaching n8n."],
  FUNCTION_UNAVAILABLE: ["Backend functions unavailable", "The Clara backend (Netlify Functions) did not respond. This is expected when the page is opened as a plain file."],

  INTERNAL_ERROR: ["Unexpected backend error", "The Clara backend function failed unexpectedly."],
};
function wfErrMeta(code) { return WF_ERRORS[code] || ["Workflow error", "Something went wrong running the workflow."]; }
function wfError(code, message) { const e = new Error(message || ""); e.code = code; return e; }
function wfRoutePill(route) { const m = ROUTE_META[route] || { label: route || "—", cls: "" }; return `<span class="route-pill ${m.cls}">${esc(m.label)}</span>`; }
function wfTime(ts) { const d = new Date(ts); return isNaN(d) ? "" : d.toLocaleTimeString("en-GB"); }
function wfNowIso() { return new Date().toISOString(); }

/* ---- reglas de routing (espejo del nodo "Routing decision" de n8n) ---- */
function wfDecideRoute({ score, signals, crm, cfg }) {
  const rules = [];
  if (score < cfg.umbral_b) {
    rules.push(`Score ${score} < qualification threshold ${cfg.umbral_b}`);
    return { route: "NURTURE", rationale: "Below the qualification threshold: no SDR time, no AI spend, stays in automated nurture.", rulesFired: rules, requiresApproval: false };
  }
  rules.push(`Score ${score} >= qualification threshold ${cfg.umbral_b}`);
  const positive = signals + ((crm.engagement && crm.engagement.contactedNotes > 0) ? 1 : 0);
  const stage = String(crm.lifecycleStage || "").toLowerCase();
  let route = "SDR_REVIEW";
  if (score >= cfg.umbral_a && positive >= 2) { route = "AE_READY"; rules.push(`Score >= ${cfg.umbral_a} and ${positive} positive signals (>=2)`); }
  else if (score >= cfg.umbral_a) rules.push(`Score >= ${cfg.umbral_a} but only ${positive} positive signal(s) (<2): SDR validates first`);
  else rules.push(`Score < high-fit threshold ${cfg.umbral_a}: SDR validates first`);
  if (route === "AE_READY" && (crm.status === "not_found" || crm.status === "unavailable")) { route = "SDR_REVIEW"; rules.push(`CRM status "${crm.status}": cannot hand off to AE without a verified HubSpot record`); }
  if (route === "AE_READY" && (stage === "customer" || stage === "evangelist")) { route = "SDR_REVIEW"; rules.push(`Lifecycle stage "${stage}": existing customer, owner reviews instead of AE outbound`); }
  return {
    route,
    rationale: route === "AE_READY"
      ? "High ICP fit, multiple positive signals and a CRM record: ready for AE handoff once a human approves."
      : "Qualified, but an SDR must validate the account before any outbound.",
    rulesFired: rules, requiresApproval: true,
  };
}
const WF_DEFAULT_ACTION = {
  NURTURE: "Keep in automated nurture; no outbound.",
  SDR_REVIEW: "SDR reviews the account and decides whether to approve an outbound sequence.",
  AE_READY: "Hand off to an AE and book a discovery call once approved.",
};

/* ---- simulación local (DEMO). Todo lo que produce va marcado como simulado. ---- */
function buildDemoResult(l) {
  const cfg = JSON.parse(JSON.stringify(CONFIG));
  const [szPts] = puntajeTamano(l.empleados);
  const [pnPts, pnWhy] = puntajeDolor(l.dolor_actual);
  const nSig = l.senales_compra.length, sigMax = cfg.pesos.senales * 3, sgPts = Math.min(nSig * cfg.pesos.senales, sigMax);
  const inRange = l.empleados >= cfg.tamano_min && l.empleados <= cfg.tamano_max;
  const score = szPts + pnPts + sgPts;
  const qualified = score >= cfg.umbral_b;
  const painTxt = pnWhy.includes("dolor alto") ? "manual or unconsolidated payment/treasury processes (high pain, hypothesis)"
    : pnWhy.includes("dolor bajo") ? "already uses a spend/treasury solution (low pain)" : "pain not classified, assumed medium";
  const crm = { source: "simulated", status: "simulated", found: false, lifecycleStage: "lead", leadStatus: null, owner: null,
    engagement: { contactedNotes: 0, lastContacted: null },
    writeback: { attempted: false, updated: false, reason: "Simulation: no HubSpot call was made." } };
  const r = wfDecideRoute({ score, signals: nSig, crm, cfg });
  const first = l.senales_compra[0] || "";
  const llm = qualified ? {
    status: "ok", model: null,
    reason: `${l.nombre} (${l.empleados.toLocaleString()} employees, ${l.pais}) fits the ICP on size and shows ${nSig} public growth signal(s). First: ${first} INFERENCE: ${String(l.dolor_actual[0] || "").split(" — ")[0]}.`,
    outreachAngle: first ? `Open with the public signal "${first}" and tie it to cross-border payments and corporate cards on one platform.` : "Open with their regional growth and tie it to cross-border payments.",
    recommendedAction: WF_DEFAULT_ACTION[r.route],
    summary: "Template text generated locally. No LLM was called in simulation mode.",
  } : { status: "skipped", skippedReason: "Below qualification threshold: LLM not called (cost control)." };
  const ts = wfNowIso();
  const T = (stage, event, status, detail) => ({ stage, event, status, detail, ts });
  const trace = [
    T("received", "Prospect received", "ok", `${l.nombre} selected in the Clara UI (simulation, no request left the browser).`),
    T("crm_context", "HubSpot context retrieved", "ok", "SIMULATED: assumed lifecycle stage \"lead\", no owner. HubSpot was not called."),
    T("scoring", "ICP score calculated", "ok", `${score}/100 = size ${szPts} + pain ${pnPts} + signals ${sgPts}. Deterministic rules, no LLM.`),
    T("scoring", qualified ? "Qualification threshold passed" : "Below qualification threshold", qualified ? "ok" : "warn", `Score ${score} ${qualified ? ">=" : "<"} qualification threshold ${cfg.umbral_b}.`),
  ];
  if (qualified) {
    trace.push(T("ai_analysis", "AI analysis requested", "ok", "SIMULATED: a real run would call the existing lead-reasoning endpoint here."));
    trace.push(T("ai_analysis", "Recommendation generated", "ok", "Template text, not an LLM output."));
  } else trace.push(T("ai_analysis", "AI analysis skipped", "skipped", llm.skippedReason));
  trace.push(T("routing", "Routing decision", "ok", `${r.route}. ${r.rulesFired.join("; ")}.`));
  trace.push(T("crm_update", "HubSpot update skipped", "skipped", "Simulation: nothing was written to HubSpot."));
  if (r.requiresApproval) trace.push(T("approval", "Human approval requested", "pending", `Waiting for a human to approve the ${r.route} recommendation. Nothing is sent without it.`));
  trace.push(T("completed", "Workflow completed", "ok", `Route: ${r.route}. (simulation)`));
  return {
    icp: {
      score, qualified, qualifyThreshold: cfg.umbral_b, highThreshold: cfg.umbral_a,
      breakdown: [
        { factor: "Company size", points: szPts, max: cfg.pesos.tamano, reason: `${l.empleados} employees, ${inRange ? "inside" : "outside"} the ideal ${cfg.tamano_min}-${cfg.tamano_max} range` },
        { factor: "Payment pain (hypothesis)", points: pnPts, max: cfg.pesos.dolor, reason: painTxt },
        { factor: "Growth signals", points: sgPts, max: sigMax, reason: `${nSig} public signal(s), ${cfg.pesos.senales} pts each (cap 3)` },
      ],
      context: [
        { label: "Country", value: l.pais, note: "not scored" }, { label: "Industry", value: l.industria, note: "not scored" },
        { label: "CRM lifecycle stage", value: "lead (assumed)", note: "simulated" }, { label: "Prior engagement", value: "none recorded", note: "simulated" },
      ],
    },
    crm, llm,
    routing: { route: r.route, rationale: r.rationale, rulesFired: r.rulesFired, requiresApproval: r.requiresApproval, recommendedAction: WF_DEFAULT_ACTION[r.route] },
    trace,
    execution: { id: null, durationMs: null, startedAt: ts, finishedAt: ts, workflow: "Local simulation (no n8n call)" },
  };
}

/* ---- ciclo de vida de una ejecución ---- */
function runWorkflow(lead, mode) {
  const prev = WF[lead.id];
  if (prev && prev.status === "running") return;
  const run = { id: `run-${++WF_SEQ}`, leadId: lead.id, company: lead.nombre, mode, status: "running",
    startedAt: Date.now(), stageIdx: 0, result: null, error: null, events: [], decisions: [],
    approved: false, effectiveRoute: null, deciding: null, decisionError: null, latencyMs: null };
  WF[lead.id] = run;
  WF_RUNS.push(run);
  refreshWorkflowPanel(lead.id);
  return mode === "demo" ? runDemo(lead, run) : runLive(lead, run);
}

function runDemo(lead, run) {
  let result;
  try { result = buildDemoResult(lead); } catch (e) { failRun(run, wfError("INTERNAL_ERROR", "The local simulation failed: " + String(e && e.message || e))); return; }
  let i = 0;
  const tick = () => {
    if (WF[lead.id] !== run) return;
    if (i < WF_STAGES.length) { run.stageIdx = i++; refreshWorkflowPanel(lead.id); setTimeout(tick, 380); }
    else completeRun(run, result);
  };
  tick();
}

async function runLive(lead, run) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 40000);
  try {
    let res, text;
    try {
      res = await fetch("/.netlify/functions/analyze-prospect", {
        method: "POST", headers: { "content-type": "application/json" }, signal: ctrl.signal,
        body: JSON.stringify({ company: lead.nombre, scoringConfig: CONFIG }),
      });
      text = await res.text();
    } catch (e) {
      if (e && e.name === "AbortError") throw wfError("CLIENT_TIMEOUT", "No answer within 40s.");
      throw wfError("FUNCTION_UNAVAILABLE", "The backend function could not be reached.");
    }
    let data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!data) throw wfError(res.status === 404 ? "FUNCTION_UNAVAILABLE" : "MALFORMED_RESPONSE", `The backend answered HTTP ${res.status} without JSON.`);
    if (!res.ok || !data.ok) throw wfError(data.error && data.error.code || "INTERNAL_ERROR", data.error && data.error.message || `HTTP ${res.status}`);
    const r = data.result;
    if (!r || !r.icp || typeof r.icp.score !== "number" || !r.routing || !ROUTE_META[r.routing.route] || !Array.isArray(r.trace)) {
      throw wfError("MALFORMED_RESPONSE", "The result did not match the expected contract.");
    }
    run.latencyMs = data.latencyMs || null;
    completeRun(run, r);
  } catch (err) {
    failRun(run, err);
  } finally {
    clearTimeout(timer);
  }
}

function completeRun(run, result) {
  const demo = run.mode === "demo";
  run.status = "completed";
  run.result = result;
  run.finishedAt = Date.now();
  run.effectiveRoute = result.routing.route;
  run.events = result.trace.map(t => ({ ...t, source: demo ? "simulation" : "n8n" }));
  if (demo) result.execution.durationMs = run.finishedAt - run.startedAt;
  if (!demo && result.llm && result.llm.estimatedCostUsd) { AI_SPEND.total_usd += result.llm.estimatedCostUsd; AI_SPEND.calls += 1; }
  CALL_LOG.push({ ts: wfNowIso(), system: demo ? "Growth workflow (demo simulation)" : "n8n (analyze-prospect)", lead: run.company,
    status: demo ? "demo" : "ok", latency_ms: result.execution.durationMs || undefined,
    detail: `${result.routing.route}, score ${result.icp.score}` });
  refreshWorkflowPanel(run.leadId);
}

function failRun(run, err) {
  const code = (err && err.code) || "INTERNAL_ERROR";
  run.status = "error";
  run.error = { code, message: String(err && err.message || "Unexpected error") };
  run.finishedAt = Date.now();
  run.events = [
    { ts: new Date(run.startedAt).toISOString(), stage: "received", event: "Prospect sent to workflow", status: "ok", detail: `${run.company}`, source: "ui" },
    { ts: wfNowIso(), stage: "completed", event: "Workflow failed", status: "error", detail: `${code}: ${run.error.message}`, source: "ui" },
  ];
  CALL_LOG.push({ ts: wfNowIso(), system: "n8n (analyze-prospect)", lead: run.company, status: "error", detail: `${code}: ${run.error.message}` });
  refreshWorkflowPanel(run.leadId);
}

/* ---- decisión humana (nunca envía nada) ---- */
async function recordDecision(lead, decision, forceLocal) {
  const run = WF[lead.id];
  if (!run || run.status !== "completed" || run.deciding) return;
  const finalRoute = decision === "approve" ? run.effectiveRoute : DECISION_META[decision].route;
  run.deciding = decision;
  run.decisionError = null;
  refreshWorkflowPanel(lead.id);
  let hubspot = null, where = "local";
  if (run.mode === "live" && !forceLocal) {
    try {
      const res = await fetch("/.netlify/functions/workflow-decision", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ company: lead.nombre, decision, currentRoute: run.effectiveRoute, approvedBefore: run.approved, score: run.result.icp.score, executionId: run.result.execution.id }),
      });
      let data = null;
      try { data = JSON.parse(await res.text()); } catch (e) { data = null; }
      if (!data) throw wfError("MALFORMED_RESPONSE", `HTTP ${res.status} without JSON.`);
      if (!res.ok || !data.ok) throw wfError(data.error && data.error.code || "INTERNAL_ERROR", data.error && data.error.message || `HTTP ${res.status}`);
      hubspot = data.result.hubspot; where = "n8n";
    } catch (err) {
      run.deciding = null;
      run.decisionError = { decision, code: err.code || "FUNCTION_UNAVAILABLE", message: err.message || "" };
      CALL_LOG.push({ ts: wfNowIso(), system: "n8n (workflow-decision)", lead: lead.nombre, status: "error", detail: run.decisionError.code });
      refreshWorkflowPanel(lead.id);
      return;
    }
    CALL_LOG.push({ ts: wfNowIso(), system: "n8n (workflow-decision)", lead: lead.nombre, status: "ok", detail: decision });
  }
  const label = DECISION_META[decision].label;
  run.decisions.push({ decision, label, finalRoute, at: wfNowIso(), where, hubspot, simulated: run.mode === "demo" });
  run.approved = decision === "approve" || decision === "outbound_ready";
  run.effectiveRoute = finalRoute;
  run.deciding = null;
  const hsNote = where === "n8n" ? (hubspot && hubspot.updated ? "Recorded in HubSpot." : `Not written to HubSpot: ${hubspot && (hubspot.error || hubspot.reason) || "n/a"}`) : "Recorded locally in this browser session only.";
  run.events.push({ ts: wfNowIso(), stage: "approval", event: `Human decision: ${label}`, status: "ok", detail: `${(ROUTE_META[finalRoute] || {}).label || finalRoute}. ${hsNote}` + (decision === "outbound_ready" ? " Production action: send to Amplemarket sequence (placeholder, nothing sent)." : ""), source: "human" });
  refreshWorkflowPanel(lead.id);
}

/* ---- render ---- */
function wfStageStates(run) {
  const states = WF_STAGES.map(s => ({ ...s, state: "pending" }));
  if (!run) return states;
  if (run.status === "running") {
    if (run.mode === "demo") states.forEach((s, i) => { s.state = i < run.stageIdx ? "ok" : i === run.stageIdx ? "active" : "pending"; });
    return states;
  }
  if (run.status === "completed") {
    states.forEach(s => {
      const its = run.events.filter(e => e.stage === s.id);
      if (!its.length) { s.state = "skipped"; return; }
      s.state = its.some(e => e.status === "error") ? "error" : its.some(e => e.status === "warn") ? "warn" : its.every(e => e.status === "skipped") ? "skipped" : "ok";
    });
  }
  return states;
}
function wfStatusPill(run) {
  if (!run) return `<span class="wf-pill">Idle</span>`;
  if (run.status === "running") {
    const label = run.mode === "demo" ? (WF_STAGES[Math.min(run.stageIdx, WF_STAGES.length - 1)].label) : "Executing in n8n…";
    return `<span class="wf-pill running">${esc(label)}</span>`;
  }
  return run.status === "completed" ? `<span class="wf-pill completed">Completed</span>` : `<span class="wf-pill error">Error</span>`;
}
function wfTimelineHtml(events) {
  return `<ul class="wf-tl">${events.map(e => `<li><span class="wf-dot ${esc(e.status)}"></span><div style="min-width:0"><b>${esc(e.event)}</b> <span style="color:var(--muted)">${esc(e.detail || "")}</span></div><span style="margin-left:auto" class="t">${esc(wfTime(e.ts))} · ${esc(e.source || "")}</span></li>`).join("")}</ul>`;
}

function renderWorkflowPanel(lead) {
  const wrap = el(`<div class="panel" id="wf-panel">
    <div class="panel-head"><h2>Growth Workflow</h2><span class="hint">Clara UI → n8n → HubSpot → scoring → LLM → routing</span></div>
    <div class="panel-body" id="wf-body"></div>
  </div>`);
  fillWorkflowPanel(wrap.querySelector("#wf-body"), lead);
  return wrap;
}
function refreshWorkflowPanel(leadId) {
  if (currentLeadId !== leadId) return;
  const body = document.getElementById("wf-body");
  const lead = LEADS.find(x => x.id === leadId);
  if (body && lead) fillWorkflowPanel(body, lead);
}

function fillWorkflowPanel(body, lead) {
  try { fillWorkflowPanelUnsafe(body, lead); }
  catch (err) {
    console.error("Workflow panel failed:", err);
    body.innerHTML = `<div class="status-note err">The workflow panel could not be displayed (${esc(String(err && err.message || err))}). The rest of the page still works.</div>`;
  }
}

function fillWorkflowPanelUnsafe(body, lead) {
  const run = WF[lead.id];
  const running = run && run.status === "running";
  body.innerHTML = "";

  body.appendChild(el(`<p style="color:var(--muted);margin:0 0 12px">n8n orchestrates, HubSpot is the system of record, scoring is deterministic, and the LLM only interprets. Nothing is ever sent to the prospect.</p>`));

  const integ = !INTEGRATION.loaded ? "" :
    !INTEGRATION.backend ? `<span class="wf-pill demo">backend functions unavailable</span>` :
    INTEGRATION.n8nConfigured ? `<span class="wf-pill live">n8n configured${INTEGRATION.writeback ? " · HubSpot write-back ON" : " · HubSpot read-only"}</span>` :
    `<span class="wf-pill demo">n8n not configured</span>`;
  const modePill = run ? (run.mode === "demo" ? `<span class="wf-pill demo">DEMO FALLBACK · simulated</span>` : `<span class="wf-pill live">LIVE · n8n</span>`) : "";
  const execInfo = run && run.status === "completed" && run.result
    ? `<span>${run.result.execution.id ? "execution " + esc(run.result.execution.id) + " · " : ""}${run.result.execution.durationMs != null ? Math.round(run.result.execution.durationMs / 100) / 10 + "s" : ""}</span>` : "";
  body.appendChild(el(`<div class="wf-meta">${wfStatusPill(run)}${modePill}${integ}${execInfo}</div>`));

  const btns = el(`<div class="btn-row" style="margin-bottom:14px">
    <button class="btn" id="wf-analyze" ${running ? "disabled" : ""}>Analyze Prospect</button>
    <button class="btn secondary" id="wf-demo" ${running ? "disabled" : ""}>Run in demo mode</button>
  </div>`);
  body.appendChild(btns);
  btns.querySelector("#wf-analyze").addEventListener("click", () => runWorkflow(lead, "live"));
  btns.querySelector("#wf-demo").addEventListener("click", () => runWorkflow(lead, "demo"));

  if (!run && INTEGRATION.loaded && !INTEGRATION.n8nConfigured) {
    body.appendChild(el(`<div class="status-note">n8n is not configured on this deployment, so <b>Analyze Prospect</b> will report that and offer the demo fallback. <b>Run in demo mode</b> shows the full flow as a clearly labeled simulation.</div>`));
  }

  const chips = el(`<div class="wf-steps"></div>`);
  wfStageStates(run).forEach(s => chips.appendChild(el(`<span class="wf-step ${s.state}">${esc(s.label)}</span>`)));
  body.appendChild(chips);
  if (running && run.mode === "live") body.appendChild(el(`<div class="status-note">Waiting for n8n. The per-stage result (CRM context, scoring, AI analysis, routing, CRM update) arrives with the response, taken from the real execution.</div>`));

  if (run && run.status === "error") {
    const [title, hint] = wfErrMeta(run.error.code);
    const box = el(`<div class="status-note err"><b>${esc(title)}</b> <span style="opacity:.75">(${esc(run.error.code)})</span><br>${esc(hint)}${run.error.message ? `<br><span style="opacity:.8">${esc(run.error.message)}</span>` : ""}
      <div class="btn-row" style="margin-top:10px"><button class="btn" id="wf-retry">Retry</button><button class="btn secondary" id="wf-fallback">Run demo fallback (simulation)</button></div></div>`);
    body.appendChild(box);
    box.querySelector("#wf-retry").addEventListener("click", () => runWorkflow(lead, run.mode));
    box.querySelector("#wf-fallback").addEventListener("click", () => runWorkflow(lead, "demo"));
  }

  if (run && run.status === "completed" && run.result) fillWorkflowResult(body, lead, run);
  if (run && run.events.length) {
    const det = el(`<details style="margin-top:14px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">Execution log (${run.events.length} events) — also in Agent Activity Log</summary>${wfTimelineHtml(run.events)}</details>`);
    body.appendChild(det);
  }
}

function fillWorkflowResult(body, lead, run) {
  const r = run.result, demo = run.mode === "demo";
  const q = r.icp.qualified;
  const warn = [];
  if (r.crm.status === "unavailable") warn.push(`HubSpot was unavailable${r.crm.error ? " (" + r.crm.error + ")" : ""}: scoring used the prospect data only and the account is capped at SDR Review.`);
  if (r.crm.status === "not_found") warn.push("This company does not exist in HubSpot yet: import it to enable CRM context and write-back. The account is capped at SDR Review.");
  if (r.llm.status === "error") warn.push(`The AI step failed${r.llm.error ? " (" + r.llm.error + ")" : ""}. Score and routing are deterministic and still valid; the text fields below are empty.`);
  if (r.crm.writeback && r.crm.writeback.attempted && !r.crm.writeback.updated) warn.push(`HubSpot rejected the update${r.crm.writeback.error ? ": " + r.crm.writeback.error : ""}. ${r.crm.writeback.reason || ""}`);
  warn.forEach(w => body.appendChild(el(`<div class="status-note err">${esc(w)}</div>`)));
  if (demo) body.appendChild(el(`<div class="status-note">Demo fallback: this result was produced by a local simulation using the same deterministic rules. HubSpot, n8n and the LLM were <b>not</b> called.</div>`));

  const src = r.llm.status !== "ok" ? "" : demo ? "template text (simulation)" : `LLM${r.llm.model ? " · " + r.llm.model : ""}`;
  const llmOff = (txt) => `<p style="color:var(--muted)">${esc(r.llm.status === "skipped" ? (r.llm.skippedReason || "AI analysis skipped.") : txt)}</p>`;
  const crmLine = (k, v) => `<div class="field-row"><span class="k">${esc(k)}</span><span class="val">${v}</span></div>`;
  const wb = r.crm.writeback || {};
  const wbTxt = wb.updated ? `Updated (${(wb.fields || []).length} AI properties)` : wb.attempted ? "Failed" : "Skipped";
  const grid = el(`<div class="wf-grid">
    <div class="wf-card">
      <h3>ICP Score</h3>
      <div class="wf-score"><span class="big">${r.icp.score}</span><span class="of">/ 100</span><span class="tag ${q ? "tier-a" : "tier-c"}">${q ? "Qualified" : "Below threshold"}</span></div>
      ${r.icp.breakdown.map(b => `<div class="field-row"><span class="k">${esc(b.factor)}<br><span style="font-size:11.5px">${esc(b.reason || "")}</span></span><span class="val pts">+${b.points == null ? "?" : b.points}${b.max != null ? " / " + b.max : ""}</span></div>`).join("")}
      <div style="color:var(--muted);font-size:11.5px;margin-top:8px">${r.icp.context.map(c => `${esc(c.label)}: ${esc(c.value)} (${esc(c.note || "")})`).join(" · ")}</div>
    </div>
    <div class="wf-card">
      <h3>Routing decision</h3>
      <div style="margin-bottom:6px">${wfRoutePill(r.routing.route)} <span style="color:var(--muted);font-size:12px">${r.routing.requiresApproval ? "needs human approval" : "no approval needed"}</span></div>
      <p>${esc(r.routing.rationale || "")}</p>
      <ul class="wf-rules">${r.routing.rulesFired.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="wf-card wide">
      <h3>Why this account matters ${src ? `<span style="text-transform:none;letter-spacing:0;font-weight:500">· ${esc(src)}</span>` : ""}</h3>
      ${r.llm.status === "ok" ? `<p>${esc(r.llm.reason || r.llm.summary || "")}</p>${r.llm.summary && r.llm.summary !== r.llm.reason ? `<p style="color:var(--muted);margin-top:6px">${esc(r.llm.summary)}</p>` : ""}` : llmOff("No AI text available for this run.")}
    </div>
    <div class="wf-card">
      <h3>Recommended next action</h3>
      <p>${esc(r.routing.recommendedAction || (r.llm.recommendedAction) || "—")}</p>
    </div>
    <div class="wf-card">
      <h3>Personalized outreach angle</h3>
      ${r.llm.status === "ok" ? `<p>${esc(r.llm.outreachAngle || "—")}</p>${r.llm.subject ? `<p style="color:var(--muted);margin-top:6px">Suggested subject: ${esc(r.llm.subject)}</p>` : ""}` : llmOff("No AI text available for this run.")}
    </div>
    <div class="wf-card wide">
      <h3>CRM status · ${r.crm.source === "simulated" ? "simulated, HubSpot not called" : "HubSpot (system of record)"}</h3>
      ${crmLine("Record", r.crm.status === "verified" ? `Found${r.crm.companyId ? " (id " + esc(r.crm.companyId) + ")" : ""}` : r.crm.status === "not_found" ? "Not found in HubSpot" : r.crm.status === "unavailable" ? "HubSpot unavailable" : "Simulated")}
      ${crmLine("Lifecycle stage", esc(r.crm.lifecycleStage || "—"))}
      ${crmLine("Owner", r.crm.owner ? esc(r.crm.owner.name || r.crm.owner.id || "—") : "Unassigned / unknown")}
      ${crmLine("AI fields write-back", `${esc(wbTxt)}${wb.reason && !wb.updated ? `<br><span style="color:var(--muted);font-weight:400;font-size:11.5px">${esc(wb.reason)}</span>` : ""}`)}
    </div>
  </div>`);
  body.appendChild(grid);

  // Human review
  const canOutbound = run.approved && (run.effectiveRoute === "AE_READY" || run.effectiveRoute === "SDR_REVIEW");
  const busy = Boolean(run.deciding);
  const review = el(`<div class="wf-review">
    <h3>Human review ${run.effectiveRoute !== r.routing.route ? `· current route ${wfRoutePill(run.effectiveRoute)}` : ""}</h3>
    <p class="wf-small">${r.routing.requiresApproval ? "A human approves before any outbound." : "No approval is required for Nurture, but a human can still override."} These buttons record a decision${demo ? " locally (demo)" : " via n8n"}; they never send a message.</p>
    <div class="btn-row">
      <button class="btn" data-d="approve" ${busy || run.effectiveRoute === "NEEDS_REVIEW" ? "disabled" : ""}>Approve</button>
      <button class="btn secondary" data-d="needs_review" ${busy ? "disabled" : ""}>Needs Review</button>
      <button class="btn secondary" data-d="nurture" ${busy ? "disabled" : ""}>Send to Nurture</button>
      <button class="btn secondary" data-d="ae_ready" ${busy ? "disabled" : ""}>AE Ready</button>
      <button class="btn secondary" data-d="outbound_ready" ${busy || !canOutbound ? "disabled" : ""} title="${canOutbound ? "" : "Approve an AE Ready or SDR Review route first"}">Outbound Ready</button>
    </div>
  </div>`);
  review.querySelectorAll("button[data-d]").forEach(b => b.addEventListener("click", () => recordDecision(lead, b.dataset.d)));
  body.appendChild(review);

  if (run.decisionError) {
    const [title, hint] = wfErrMeta(run.decisionError.code);
    const box = el(`<div class="status-note err" style="margin-top:10px"><b>Decision not recorded: ${esc(title)}</b><br>${esc(hint)}
      <div class="btn-row" style="margin-top:8px"><button class="btn secondary" id="wf-local">Record locally instead (not written to HubSpot)</button></div></div>`);
    box.querySelector("#wf-local").addEventListener("click", () => recordDecision(lead, run.decisionError.decision, true));
    body.appendChild(box);
  }
  if (run.decisions.length) {
    body.appendChild(el(`<div style="margin-top:10px;font-size:12.5px">${run.decisions.map(d => `<div class="field-row"><span class="k">${esc(d.label)} → ${wfRoutePill(d.finalRoute)}</span><span class="val" style="font-weight:400;color:var(--muted)">${d.where === "n8n" ? (d.hubspot && d.hubspot.updated ? "recorded in HubSpot via n8n" : "sent to n8n, not written to HubSpot") : d.simulated ? "demo, local only" : "local only"} · ${esc(wfTime(d.at))}</span></div>`).join("")}</div>`));
  }
  if (run.effectiveRoute === "OUTBOUND_READY") {
    body.appendChild(el(`<div class="wf-callout"><b>Production action: send to Amplemarket sequence.</b> Architectural placeholder only: there is no Amplemarket integration in this project and nothing was sent.</div>`));
  }
}

/* ---- Pipeline: carriles de routing del workflow ---- */
function renderRoutingLanes() {
  const done = Object.values(WF).filter(r => r.status === "completed");
  const lanes = [
    { route: "NURTURE", title: "Nurture", rule: `Score < ${CONFIG.umbral_b}`, note: "No outbound. Automated lifecycle only." },
    { route: "SDR_REVIEW", title: "SDR Review", rule: `Score ≥ ${CONFIG.umbral_b} (qualified)`, note: "A human validates the account first." },
    { route: "AE_READY", title: "AE Ready", rule: `Score ≥ ${CONFIG.umbral_a}, ≥2 positive signals, CRM record`, note: "Handoff after human approval." },
    { route: "OUTBOUND_READY", title: "Outbound Ready", rule: "Human-approved outbound", note: "Production action: send to Amplemarket sequence (placeholder, nothing is sent)." },
  ];
  const review = done.filter(r => r.effectiveRoute === "NEEDS_REVIEW");
  const wrap = el(`<div class="panel">
    <div class="panel-head"><h2>Workflow routing (n8n)</h2><span class="hint">${done.length} prospect(s) analyzed this session · deterministic rules, human approval before outbound</span></div>
    <div class="panel-body"><div class="route-lanes"></div>
      ${review.length ? `<div class="wf-small" style="margin-top:10px">Needs Review: ${review.map(r => esc(r.company)).join(", ")}</div>` : ""}
      ${done.length ? "" : `<div class="wf-small" style="margin-top:10px">Nothing analyzed yet. Open a lead and click <b>Analyze Prospect</b>; results land in these lanes.</div>`}
    </div></div>`);
  const holder = wrap.querySelector(".route-lanes");
  lanes.forEach(l => {
    const members = done.filter(r => r.effectiveRoute === l.route);
    const lane = el(`<div class="route-lane"><h3>${wfRoutePill(l.route)} <span style="color:var(--muted);font-weight:500">${members.length}</span></h3><div class="rule">${esc(l.rule)}<br>${esc(l.note)}</div></div>`);
    if (!members.length) lane.appendChild(el(`<div class="empty">—</div>`));
    members.forEach(r => {
      const chip = el(`<button class="lead-chip" data-id="${esc(r.leadId)}">${esc(r.company)} · ${r.result.icp.score}${r.mode === "demo" ? " · demo" : ""}</button>`);
      chip.addEventListener("click", () => openLead(r.leadId));
      lane.appendChild(chip);
    });
    holder.appendChild(lane);
  });
  return wrap;
}

function renderWorkflowRuns() {
  const wrap = el(`<div class="panel">

    <div class="panel-body" id="wf-runs"></div></div>`);
  const holder = wrap.querySelector("#wf-runs");
  if (!WF_RUNS.length) {
    holder.appendChild(el(`<span style="color:var(--muted)">None yet. Open a lead and click <b>Analyze Prospect</b> to see the full event trail (prospect received, HubSpot context, ICP score, threshold, AI analysis, recommendation, human approval, HubSpot update, completed).</span>`));
    return wrap;
  }
  WF_RUNS.slice().reverse().forEach(run => {
    const route = run.status === "completed" ? wfRoutePill(run.effectiveRoute) : "";
    const d = el(`<details class="wf-run"><summary><b>${esc(run.company)}</b>
      ${run.mode === "demo" ? '<span class="wf-pill demo">demo · simulated</span>' : '<span class="wf-pill live">live · n8n</span>'}

    holder.appendChild(d);

  return wrap;
}
