<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growth Orchestrator</title>
<meta name="description" content="Event to state to decision to AI/rules to action to audit: a working vertical slice of Clara's growth orchestration system on synthetic data." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --ink: #F5F7FB; --panel: #FFFFFF; --panel-2: #EEF1F7; --line: #DFE4EE; --text: #10182B; --muted: #64708A;
  --accent: #2F5DF4; --accent-dim: #E7ECFE; --teal: #12977C; --teal-dim: #E2F4EF; --good: #16A34A; --good-dim: #E5F6EA;
  --warn: #B4740E; --warn-dim: #FBF1DE; --bad: #DC2626; --bad-dim: #FCE8E8;
  --rail-bg: #0D1B3D; --rail-text: #F1F4FC; --rail-muted: #9AA9D6; --rail-line: rgba(255,255,255,.08);
  --font-head: 'Inter', sans-serif; --font-body: 'IBM Plex Sans', sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: flex; min-height: 100vh; }
.rail { width: 236px; flex-shrink: 0; background: var(--rail-bg); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--rail-text); }
.sub { color: var(--rail-muted); font-size: 11.5px; margin: 2px 0 14px; }
.nav button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #C9D3F0; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button.active { background: #24408F; color: #fff; font-weight: 600; }
.rail .note { margin-top: 16px; border-top: 1px solid var(--rail-line); padding-top: 12px; color: var(--rail-muted); font-size: 11.5px; }
.rail .note a { color: #8FC0FF; }
.pill-safe { display: inline-block; background: rgba(123,224,196,.14); color: #7BE0C4; border-radius: 4px; padding: 3px 7px; font-size: 11px; margin-bottom: 8px; }
main { flex: 1; min-width: 0; padding: 26px 32px 60px; max-width: 1200px; }
h1 { font-family: var(--font-head); font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-family: var(--font-head); font-size: 17px; margin: 26px 0 10px; }
h3 { font-family: var(--font-head); font-size: 14px; margin: 0 0 8px; }
.lede { color: var(--muted); max-width: 820px; margin: 0 0 16px; }
.card { overflow-wrap: anywhere; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi .v { font-family: var(--font-head); font-size: 22px; font-weight: 700; } .kpi .l { color: var(--muted); font-size: 12px; }
.banner { background: var(--teal-dim); border: 1px solid #BFE6DA; color: #0B5E4D; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
.banner.warn { background: var(--warn-dim); border-color: #EDD5A8; color: #7A4E07; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); margin: 1px 3px 1px 0; white-space: nowrap; }
.tag.good { background: var(--good-dim); color: #11733A; } .tag.bad { background: var(--bad-dim); color: #A61B1B; } .tag.warn { background: var(--warn-dim); color: #8A5A0A; } .tag.acc { background: var(--accent-dim); color: #2347C4; }
.mono { font-family: var(--font-mono); font-size: 12px; }
pre { font-family: var(--font-mono); font-size: 12px; background: var(--panel-2); border-radius: 6px; padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
.tablewrap { overflow-x: auto; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; } .btn.ghost { background: var(--panel); color: var(--accent); border: 1px solid var(--line); }
.chips button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; margin: 0 6px 6px 0; }
.chips button.active, .chips button:hover { border-color: var(--accent); color: var(--accent); }
textarea, select, input[type=text] { width: 100%; font-family: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: #fff; color: var(--text); }
textarea { min-height: 90px; resize: vertical; }
label.small { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
.step { border-left: 3px solid var(--line); padding: 4px 0 8px 12px; margin-left: 4px; }
.step.decision { border-color: var(--accent); } .step.ai { border-color: #8B5CF6; } .step.effect { border-color: var(--teal); } .step.alert { border-color: var(--bad); }
.step .k { font-weight: 600; font-size: 12.5px; } .step .d { color: var(--muted); font-size: 12.5px; }
.email { border: 1px dashed #B9C3DA; border-radius: 8px; padding: 12px; background: #FBFCFE; }
.email .hdr { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.email .body { white-space: pre-wrap; font-size: 13px; }
.cmp td:first-child { color: var(--muted); width: 190px; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
svg text { font-family: var(--font-body); }
.hidden { display: none; }
.topbar { display: none; }
@media (max-width: 900px) {
  .app { display: block; } .rail { display: none; width: 100%; height: auto; position: static; } .rail.open { display: block; }
  .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--rail-bg); color: #fff; padding: 10px 16px; }
  .topbar button { background: transparent; color: #fff; border: 1px solid #3A5398; border-radius: 6px; padding: 4px 10px; }
  main { padding: 18px 16px 50px; }
  .tag { white-space: normal; }
  .chips button { text-align: left; }
  .g4, .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
}
body { font-size: 15px; }
main { padding: 30px 40px 70px; }
h1 { font-size: 28px; margin-bottom: 8px; } h2 { font-size: 19px; margin: 30px 0 12px; }
.lede { font-size: 15.5px; line-height: 1.6; color: #4A5672; }
.card { border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,43,.04), 0 6px 18px rgba(16,24,43,.04); }
.kpi.big .v { font-size: 30px; letter-spacing: -.02em; } .kpi.big .l { font-size: 13.5px; margin-top: 4px; }
.navgroup { color: var(--rail-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 10px 4px; }
.barrow { display: grid; grid-template-columns: minmax(150px, 1.3fr) 3fr 80px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.barrow:last-child { border-bottom: 0; } .barrow .d { font-size: 12.5px; }
.track { background: var(--panel-2); border-radius: 8px; height: 12px; overflow: hidden; } .fill { height: 100%; border-radius: 8px; }
.bv { text-align: right; }
.steps .n, .tl .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; flex-shrink: 0; }
.timeline { margin-top: 14px; } .tl { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); } .tl > div:last-child { flex: 1; min-width: 0; } .tl .n { margin: 2px 0 0; }
.tl .barrow { grid-template-columns: 130px 1fr 60px; padding: 5px 0; }
input[type=number] { font-family: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; max-width: 140px; background: #fff; color: var(--text); }
input.mini { width: 78px; } .small2 { font-size: 13px; display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 4px 0; }
details > summary { cursor: pointer; font-weight: 600; }
@media (max-width: 900px) { main { padding: 18px 16px 50px; } .barrow { grid-template-columns: 1fr; gap: 4px; } .bv { text-align: left; } }
.small2 b { white-space: nowrap; }
</style>
</head>
<body>
<div class="topbar"><strong>Growth Orchestrator</strong><button id="menu" aria-label="Menu">Menu</button></div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">Growth Orchestrator</div>
    <div class="sub">Clara challenge · synthetic data</div>
    <div class="pill-safe">Outreach is mock-only: no email is ever sent</div>
    <nav class="nav" id="nav">
      <button data-v="overview" class="active">Overview</button>
      <button data-v="priority">Who to call first</button>
      <button data-v="automation">What runs by itself</button>
      <button data-v="account">One account, step by step</button>
      <button data-v="live">Replies with AI</button>
      <button data-v="evals">Quality checks</button>
      <div class="navgroup">For engineers</div>
      <button data-v="flows">Key flows</button>
      <button data-v="stream">Sample stream</button>
    </nav>
    <div class="note">
      Docs: <a href="https://github.com/apogeoconsara/portafolioclara/tree/dev/growth-orchestrator" target="_blank" rel="noopener">README</a> ·
      <a href="https://github.com/apogeoconsara/portafolioclara/blob/dev/growth-orchestrator/docs/DECISION_LOG.md" target="_blank" rel="noopener">Decision log</a> ·
      <a href="https://github.com/apogeoconsara/portafolioclara/blob/dev/growth-orchestrator/docs/MEASUREMENT_PLAN.md" target="_blank" rel="noopener">Measurement</a> ·
      <a href="https://github.com/apogeoconsara/portafolioclara/blob/dev/growth-orchestrator/docs/PRODUCTION.md" target="_blank" rel="noopener">Production</a>
    </div>
  </aside>
  <main id="main"><p class="lede">Loading…</p></main>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const J = v => esc(JSON.stringify(v, null, 2));
const tag = (t, cls = "") => `<span class="tag ${cls}">${esc(t)}</span>`;
const ACTION_CLS = { contact: "good", handoff_ae: "acc", suppress: "bad", escalate_human: "warn", wait: "", enrich: "acc", update_state: "", no_action: "" };
const act = a => a ? tag(a, ACTION_CLS[a] || "") : tag("no action (intake)");
const DATA = {};
async function load(name) { if (!DATA[name]) DATA[name] = await (await fetch(`data/${name}.json`)).json(); return DATA[name]; }

// ---------------------------------------------------------------------------------------------------------------
const VIEWS = {
  async overview() {
    const [ov, runs, stream, ev] = await Promise.all([load("overview"), load("runs"), load("stream"), load("evals")]);
    const n = runs.scenarios.length, A = ov.actions, hm = hoursModel(ov);
    const passed = runs.scenarios.filter(s => s.results.every((r, i) => matches(r, s.expected[i]).ok)).length;
    return `
      <h1>Growth Orchestration System</h1>
      <p class="lede">Clara has tens of thousands of companies it could talk to. Deciding <b>who</b> to contact, <b>what</b> to say and <b>when</b>
      is slow work that people repeat account by account. This system does it automatically and safely, and leaves people only the cases that need judgment.</p>
      <div class="banner">Everything here uses synthetic companies. Emails are only prepared and recorded in a simulated log: <b>nothing is ever sent</b>.</div>
      <div class="grid g4">
        <div class="card kpi big"><div class="v">${fmt(ov.n_accounts)}</div><div class="l">companies reviewed, one by one, in about 10 seconds</div></div>
        <div class="card kpi big"><div class="v">${fmt(A.contact)}</div><div class="l">ready for a first email</div></div>
        <div class="card kpi big"><div class="v">~${fmt(hm.saved)} h</div><div class="l">of manual work avoided (about ${hm.months.toFixed(1)} people-months). <a href="#automation" data-go="automation">See the assumptions</a></div></div>
        <div class="card kpi big"><div class="v">0</div><div class="l">emails sent</div></div>
      </div>
      <h2>What happened to the ${fmt(ov.n_accounts)} companies</h2>
      <div class="card">${ACTION_ORDER.map(k => bar(ov.plain.actions[k][0], A[k] || 0, ov.n_accounts, ACTION_BAR[k], ov.plain.actions[k][1])).join("")}</div>
      <h2>How it works</h2>
      <div class="grid g4 steps">
        <div class="card"><div class="n">1</div><h3>Something happens</h3>A company is added to a list, replies, unsubscribes or books a meeting. Each event updates what the system knows.</div>
        <div class="card"><div class="n">2</div><h3>Rules check</h3>Is it safe and sensible to contact? Customers, opt-outs, open deals and recent emails are all caught here. No AI involved.</div>
        <div class="card"><div class="n">3</div><h3>AI helps where words matter</h3>It reads replies and drafts a personal opening line, only from verified facts. Its answers are checked before anything uses them.</div>
        <div class="card"><div class="n">4</div><h3>Action and record</h3>The system prepares the email, books the next step or hands the account to a person. Every step is written to an audit trail.</div>
      </div>
      <p class="lede" style="margin-top:12px"><b>The model suggests, the rules decide.</b> The AI never picks the action, the sales exec or who can be emailed.</p>
      <h2>Does it behave?</h2>
      <div class="grid g3">
        <div class="card kpi"><div class="v">${passed}/${n}</div><div class="l">test situations reproduced exactly (opt-outs, duplicates, failures, late events…)</div></div>
        <div class="card kpi"><div class="v">${esc(stream.agreement_with_truth)}</div><div class="l">sample deliveries matching the independent answer key</div></div>
        <div class="card kpi"><div class="v">${esc(ev.recorded.summary.verdict_and_codes_match)}</div><div class="l">AI outputs (good and deliberately broken) judged correctly by the safety checks</div></div>
      </div>
      <details class="card" style="margin-top:14px"><summary>Technical architecture</summary><div style="overflow-x:auto">${diagram()}</div></details>
      <p class="d" style="margin-top:12px">${esc(ov.label)} The hours are estimates from editable assumptions, not measurements.</p>`;
  },

  async flows() {
    const runs = await load("runs");
    const MAIN = ["D1", "D2", "D3", "D4", "D6"];
    const main = runs.flows.filter(x => MAIN.includes(x.id)), more = runs.flows.filter(x => !MAIN.includes(x.id));
    const flowId = state.flow || main[0].id;
    const f = runs.flows.find(x => x.id === flowId);
    const chip = x => `<button data-flow="${x.id}" class="${x.id === flowId ? "active" : ""}">${esc(x.id)} · ${esc(x.title)}</button>`;
    const scen = f.golden.map(id => runs.scenarios.find(s => s.id === id));
    return `<h1>Key flows</h1><p class="lede">${esc(runs.label)}</p>
      <div class="chips">${main.map(chip).join("")}</div>
      <div class="card" style="margin-bottom:12px"><h3>${esc(f.title)}</h3><div class="d">Challenge requirement: ${esc(f.pdf_requirement)}</div>
      <ul>${f.show.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      ${scen.map(trace).join("")}
      <details class="card" style="margin-top:18px" ${state.more ? "open" : ""}><summary><b>More cases</b>: ${more.map(x => esc(x.id)).join(", ")} and all ${runs.scenarios.length} golden scenarios</summary>
        <div class="chips" style="margin-top:10px">${more.map(chip).join("")}</div>
        ${scenarioList(runs)}</details>`;
  },

  async scenarios() { state.more = true; return VIEWS.flows(); },

  async priority() {
    const ov = await load("overview"), w = weights(ov.config);
    const f = (k, label, help, max) => `<div><label class="small" for="w_${k}">${label}</label><input type="number" id="w_${k}" data-w="${k}" min="0" max="${max}" value="${w[k]}"><div class="d">${help}</div></div>`;
    return `<h1>Who to call first</h1>
      <p class="lede">Not every ready company deserves the same attention. Each one gets a score from 0 to 100 from three simple things. High and standard scores get an email whose opening line
      the AI personalizes from verified facts. Low scores get the plain template, without spending any AI.</p>
      <div class="banner warn">The weights below are my assumptions, not Clara's real ideal-customer profile. Change them to see the effect on all ${fmt(ov.n_accounts)} companies. Edits here are a simulation on this page; the engine runs on the defaults.</div>
      <div class="card"><h3>What earns points</h3>
        <div class="grid g3">${f("size", "Right-sized company", "Full points for 51 to 1,000 employees, half for 11 to 50 or over 1,000", 100)}
        ${f("pain", "Likely payment pain", "Public facts suggest manual payments or expenses (a hypothesis, not confirmed)", 100)}
        ${f("signal_each", "Each growth signal", "Hiring, expansion, funding or international activity. Up to 3 count.", 50)}</div>
        <div class="grid g2" style="margin-top:8px">${f("tier_a", "Top priority from", "Top priority label (today it behaves like Standard)", 100)}${f("tier_b", "Standard from", "Below this: plain template, no AI call", 100)}</div>
        <p style="margin:10px 0 0"><button class="btn ghost" id="wReset">Reset to defaults</button></p></div>
      <div id="priOut"></div>`;
  },

  async automation() {
    const ov = await load("overview");
    return `<h1>What runs by itself</h1>
      <p class="lede">These are the tasks people do by hand today, account after account. The times are my assumptions: edit any number and everything recalculates.</p>
      <div id="autoOut"></div>`;
  },

  async account() {
    const d = await load("scoring"), A = d.accounts, P = d.plain;
    const label = a => a.not_pass[0] ? (P.codes[a.not_pass[0][2]] || a.not_pass[0][2]) : "Ready to contact";
    const first = {}; for (const a of A) { const k = label(a); (first[k] = first[k] || a); }
    const ex = Object.entries(first).sort((x, y) => (x[0] === "Ready to contact" ? -1 : y[0] === "Ready to contact" ? 1 : x[0].localeCompare(y[0])));
    const sel = state.acc || first["Ready to contact"].id;
    return `<h1>One account, step by step</h1>
      <p class="lede">Pick a company to see what the system knows, which safety checks it ran, its priority, and what it decided. These are the 500 accounts of the sample world.</p>
      <div class="d" style="margin-bottom:6px">Jump to an example:</div>
      <div class="chips" id="audEx">${ex.map(([c, a]) => `<button data-acc="${a.id}" class="${a.id === sel ? "active" : ""}">${esc(c)}</button>`).join("")}</div>
      <label class="small" for="audSel">Or choose any of the ${A.length} accounts</label>
      <select id="audSel">${A.map(a => `<option value="${a.id}" ${a.id === sel ? "selected" : ""}>${esc(a.name)} · ${esc(a.country)} · ${esc(P.actions[a.decision.action][0])}</option>`).join("")}</select>
      <div id="audOut"></div>`;
  },

  async live() {
    const cases = await load("cases");
    const drafts = cases.cases.filter(c => c.kind === "personalization_grounding");
    return `<h1>Replies with AI</h1><p class="lede">Paste what a prospect might answer and watch the real model read it. These calls go to the real model through a Netlify function that holds the API key
      server-side. The function uses the same prompts as the Python engine and a JS port of its validators (tested for parity on
      all 220 recordings). It has no email client: nothing here can send a message.</p>
      <div id="status" class="banner warn">Checking whether the live model is configured…</div>
      <h2>1. Reply interpretation and qualification extraction</h2>
      <div class="grid g2">
        <div class="card">
          <div class="chips" id="samples">
            ${SAMPLES.map((s, i) => `<button data-sample="${i}">${esc(s.name)}</button>`).join("")}
          </div>
          <label class="small" for="reply">Prospect reply (untrusted text, max 2000 chars)</label>
          <textarea id="reply" maxlength="2000">${esc(SAMPLES[0].text)}</textarea>
          <div class="grid g2">
            <div><label class="small" for="crm">Account state (from the CRM, not from the model)</label>
              <select id="crm"><option>prospect</option><option>customer</option><option>churned_customer</option><option>active_opportunity</option><option>ae_assigned</option></select></div>
            <div><label class="small" for="rdate">Reply date</label><input type="text" id="rdate" value="2026-10-01" /></div>
          </div>
          <p><button class="btn" id="runReply">Interpret with the live model</button></p>
        </div>
        <div class="card" id="replyOut"><div class="d">The model's raw output, the validator verdict and the action chosen by rules will appear here.</div></div>
      </div>
      <h2>2. Grounded personalization</h2>
      <div class="grid g2">
        <div class="card">
          <label class="small" for="dcase">Account</label>
          <select id="dcase">${drafts.map(c => `<option value="${c.case_id}">${esc(c.case_id)} · ${esc(c.input.account.name)} (${c.expected.usable_fact_ids.length} usable facts)</option>`).join("")}</select>
          <label class="small">Facts the model is given (rules decide which are usable: verified, ≤1 year old, about this company, consistent with the CRM)</label>
          <div id="facts"></div>
          <p><button class="btn ghost" id="addFact">Add a fact</button> <button class="btn" id="runDraft">Draft with the live model</button></p>
        </div>
        <div class="card" id="draftOut"><div class="d">The draft (display only), the claims it makes and the fact each one cites will appear here.</div></div>
      </div>`;
  },

  async evals() {
    const ev = await load("evals");
    const rec = ev.recorded;
    const byVariant = {};
    for (const c of rec.cases) { (byVariant[c.variant] ||= { n: 0, ok: 0, verdicts: {} }); const b = byVariant[c.variant]; b.n++; b.ok += c.match ? 1 : 0; b.verdicts[c.verdict] = (b.verdicts[c.verdict] || 0) + 1; }

const CMP = ["action", "handling", "best_contact_id", "wait_until", "route_to_ae_id", "route_reason", "final_action", "final_reason_codes",
  "send_after", "scope", "contact_id", "cancel_pending_outreach", "usable_fact_ids", "needs_human_review", "automation_allowed"];
function matches(r, x) {
  const rows = [];
  let ok = true;
  for (const k of CMP) {
    if (!(k in x) || ((x[k] === null || (Array.isArray(x[k]) && !x[k].length)) && !["action", "handling", "automation_allowed"].includes(k))) continue;
    const good = JSON.stringify(r[k]) === JSON.stringify(x[k]);
    ok = ok && good; rows.push([k, x[k], r[k], good]);
  }
  if (x.reason_codes && x.reason_codes.length) {
    const good = x.reason_codes.every(c => r.reason_codes.includes(c));
    ok = ok && good; rows.push(["reason_codes", x.reason_codes, r.reason_codes, good]);
  }
  return { ok, rows };
}

function scenarioList(runs) {
  const tags = [...new Set(runs.scenarios.flatMap(s => s.tags))].sort();
  const t = state.tag || "";
  const rows = runs.scenarios.filter(s => !t || s.tags.includes(t)).map(s => {
    const ok = s.results.every((r, i) => matches(r, s.expected[i]).ok);
    return `<tr class="click" data-sc="${s.id}"><td class="mono">${s.id}</td><td>${esc(s.title)}</td>
      <td>${s.results.map(x => act(x.action)).join(" ")}</td><td>${s.results.map(x => tag(x.handling)).join(" ")}</td>
      <td>${ok ? '<span class="ok">match</span>' : '<span class="no">differs</span>'}</td></tr>`;
  }).join("");
  const detail = state.sc ? trace(runs.scenarios.find(s => s.id === state.sc)) : "";
  return `<p class="d" style="margin-top:12px">Every scenario in data/seed/golden_scenarios.jsonl, run through the engine on a fresh database. Click a row for the full trace.</p>
    <div class="chips"><button data-tag="" class="${!t ? "active" : ""}">all</button>${tags.map(x => `<button data-tag="${esc(x)}" class="${x === t ? "active" : ""}">${esc(x)}</button>`).join("")}</div>
    <div id="detail">${detail}</div>
    <div class="tablewrap"><table><thead><tr><th>id</th><th>scenario</th><th>decision</th><th>handling</th><th>vs expected</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Scoring weights are edited in the browser (kept in localStorage). Mirrors orchestrator/scoring.py; tests/js/scoring.test.mjs checks parity.
function scoreOf(feat, cfg, w) {
  const size = { ideal: w.size, edge: Math.floor(w.size * cfg.size_edge_fraction + 0.5), below: 0, unknown: 0 }[feat.size];
  const pain = feat.pain ? w.pain : 0, sig = Math.min(feat.signals.length, cfg.signal_cap) * w.signal_each, total = size + pain + sig;
  return { score: total, tier: total >= w.tier_a ? "A" : total >= w.tier_b ? "B" : "C", parts: { size, pain, signals: sig } };
}
const WKEY = "orch.weights";
function weights(cfg) { return { ...cfg.weights, tier_a: cfg.tier_a, tier_b: cfg.tier_b, ...(store.get(WKEY) || {}) }; }

function trace(s) {
  const blocks = s.events.map((e, i) => {
    const r = s.results[i], x = s.expected[i];
    const audit = s.audit.filter(a => a.event_id === e.event_id && !["event_received"].includes(a.kind));
    const steps = audit.map(a => {
      const cls = a.kind === "decision" ? "decision" : a.kind.startsWith("ai") || a.kind === "draft" ? "ai" :
        ["alert", "human_review_queued", "internal_error"].includes(a.kind) ? "alert" : "effect";
      const d = { ...a.detail };
      return `<div class="step ${cls}"><div class="k">${esc(a.kind.replaceAll("_", " "))} <span class="d mono">${esc(a.ts || "")}</span></div>
        <div class="d mono">${esc(JSON.stringify(d))}</div></div>`;
    }).join("");
    const m = matches(r, x);
    const email = r.email ? `<div class="email" style="margin-top:8px"><div class="hdr">Mock email · ${esc(r.email.mode)} · ${esc(r.email.status)} · to ${esc(r.email.to)} · send_after ${esc(r.send_after)} — <b>written to the mock ledger, never sent</b></div>

    return `<div class="card" style="margin-bottom:10px">

      ${r.final_action && r.final_action !== r.action ? ` → after execution ${act(r.final_action)} ${r.final_reason_codes.map(c => tag(c)).join("")}` : ""}
      ${r.route_to_ae_id ? tag(`AE ${r.route_to_ae_id} (${r.route_reason})`, "acc") : ""}</div>
      ${ai}${email}
      <details style="margin-top:8px"><summary>Audit trail (${audit.length} steps)</summary>${steps || '<div class="d">Intake only.</div>'}</details>
      <details><summary>Expected vs got: ${m.ok ? '<span class="ok">match</span>' : '<span class="no">differs</span>'}</summary>
        <table class="cmp">${m.rows.map(([k, a, b, g]) => `<tr><td>${esc(k)}</td><td class="mono">${esc(JSON.stringify(a))}</td><td class="mono">${esc(JSON.stringify(b))}</td><td>${g ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'}</td></tr>`).join("")}</table></details>
    </div>`;
  }).join("");
  const mock = Object.keys(s.mock).length ? `Mock behaviour: ${Object.entries(s.mock).map(([k, v]) => tag(`${k}: ${v}`, "warn")).join("")}` : "Mock systems: all ok";
  const calls = s.calls.length ? `<details><summary>External calls (${s.calls.length})</summary><pre>${esc(s.calls.map(c => c.join("  ")).join("\n"))}</pre></details>` : "";
  return `<h2>${esc(s.id)} · ${esc(s.title)}</h2>
    <div class="d" style="margin-bottom:8px">${s.tags.map(t => tag(t)).join("")} ${mock} · ledgers: emails ${s.ledger.send.length}, CRM writes ${s.ledger.crm.length}, meetings ${s.ledger.calendar.length}
    · review queue ${s.review_queue.length} · dead letters ${s.dead_letters.length}</div>${blocks}${calls}`;
}

async function fn(body) {
  const r = await fetch("/.netlify/functions/orchestrator-llm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  let j; try { j = await r.json(); } catch { j = { error: `HTTP ${r.status}` }; }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function bindLive() {
  const cases = await load("cases");

  setCase($("#dcase").value);
  $("#dcase").onchange = e => setCase(e.target.value);
  $("#addFact").onclick = () => { if (facts.length < 5) { facts.push({ text: "", is_verified: true, observed_at: "2026-09-01T16:00:00Z" }); drawFacts(); } };
  $("#facts").oninput = e => { const t = e.target;
    if (t.dataset.fi) facts[+t.dataset.fi].text = t.value; if (t.dataset.fo) facts[+t.dataset.fo].observed_at = t.value;
    if (t.dataset.fv) facts[+t.dataset.fv].is_verified = t.checked; };
  $("#samples").onclick = e => { const i = e.target.dataset.sample; if (i !== undefined) $("#reply").value = SAMPLES[+i].text; };
  if (LIVE.reply) {                                    // restore the last reply run
    $("#reply").value = LIVE.reply.input.reply_text; $("#crm").value = LIVE.reply.input.crm_state;
    $("#rdate").value = LIVE.reply.input.received_date; $("#replyOut").innerHTML = LIVE.reply.html;
  }
  if (LIVE.draft && cases.cases.some(c => c.case_id === LIVE.draft.case_id)) {   // and the last draft run
    $("#dcase").value = LIVE.draft.case_id;
    facts = LIVE.draft.facts.map(f => ({ text: f.text, is_verified: f.is_verified, observed_at: f.observed_at })); drawFacts();
    $("#draftOut").innerHTML = LIVE.draft.html;
  }
  $("#runReply").onclick = async () => {
    const b = $("#runReply"); b.disabled = true; $("#replyOut").innerHTML = '<div class="d">Calling the model…</div>';
    const input = { reply_text: $("#reply").value, crm_state: $("#crm").value, received_date: $("#rdate").value };
    try { LIVE.reply = { input, html: renderReply(await fn({ task: "reply", ...input })) }; }
    catch (e) { LIVE.reply = { input, html: `<div class="no">${esc(e.message)}</div>` }; }
    store.set("orch.liveReply", LIVE.reply);
    if ($("#replyOut")) { $("#replyOut").innerHTML = LIVE.reply.html; $("#runReply").disabled = false; }
  };
  $("#runDraft").onclick = async () => {
    const b = $("#runDraft"); b.disabled = true; $("#draftOut").innerHTML = '<div class="d">Calling the model…</div>';
    const case_id = $("#dcase").value, sent = facts.filter(f => f.text.trim());
    try { LIVE.draft = { case_id, facts: sent, html: renderDraft(await fn({ task: "draft", case_id, facts: sent })) }; }
    catch (e) { LIVE.draft = { case_id, facts: sent, html: `<div class="no">${esc(e.message)}</div>` }; }
    store.set("orch.liveDraft", LIVE.draft);
    if ($("#draftOut")) { $("#draftOut").innerHTML = LIVE.draft.html; $("#runDraft").disabled = false; }
  };
  fn({ task: "status" }).then(st => {                  // after the buttons are wired, so a quick click always works
    if (!$("#status")) return;
    $("#status").className = st.configured ? "banner" : "banner warn";
    $("#status").textContent = st.configured ? `Live model configured: ${st.model}. Emails: none — this function cannot send email.` :
      "The live model is not configured on this site (ANTHROPIC_API_KEY missing). The recorded runs and evals still work.";
  }).catch(e => { if ($("#status")) $("#status").textContent = "Live function unreachable: " + e.message; });
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const LIVE = { eval: store.get("orch.liveEval"), reply: store.get("orch.liveReply"), draft: store.get("orch.liveDraft") };

  $("#runEval").textContent = e && !e.running ? "Run the live eval again" : "Run the live eval";
  $("#evalProg").textContent = !e ? "" : e.running ? e.progress :
    `${e.complete ? "Last run" : "Partial run (interrupted)"}: ${e.payload.ran_at} · ${e.payload.model}`;
  $("#dlEval").classList.toggle("hidden", !(e && !e.running && e.out.length));
  out.innerHTML = e ? evalTable(e.out) : "";
}

function evalPayload(out) {
  const model = (out.find(r => r.model) || {}).model || "unknown";
  return { suite: "live", source: "netlify function (web page)", model, ran_at: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
    summary: evalSummary(out), cases: out };
}

async function runEval() {
  const cases = await load("cases");
  LIVE.eval = { out: [], running: true, complete: false, progress: "starting…", payload: null };
  renderEval();
  for (const [i, c] of cases.cases.entries()) {
    LIVE.eval.progress = `case ${i + 1}/${cases.cases.length}: ${c.case_id}`;
    renderEval();
    try { LIVE.eval.out.push(await fn({ task: "eval_case", case_id: c.case_id })); }
    catch (e) { LIVE.eval.out.push({ case_id: c.case_id, error: e.message }); if (/not configured/.test(e.message)) break; }
    LIVE.eval.payload = evalPayload(LIVE.eval.out);
    store.set("orch.liveEval", LIVE.eval);
  }
  LIVE.eval.running = false;
  LIVE.eval.complete = LIVE.eval.out.length === cases.cases.length;
  LIVE.eval.payload = evalPayload(LIVE.eval.out);
  store.set("orch.liveEval", LIVE.eval);
  renderEval();
}

function bindEvals() {
  $("#runEval").onclick = () => { if (!(LIVE.eval && LIVE.eval.running)) runEval(); };
  $("#dlEval").onclick = () => {
    const p = LIVE.eval.payload, a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(p, null, 2)], { type: "application/json" }));
    a.download = `live-eval-${p.ran_at.replace(/[:-]/g, "")}.json`; a.click();
  };
  renderEval();
}

function evalSummary(out) {
  const rep = out.filter(r => r.kind === "reply"), dr = out.filter(r => r.kind === "draft");
  const pct = (a, b) => b ? `${a}/${b} (${Math.round(100 * a / b)}%)` : "—";
  return { reply_cases: rep.length, label_accuracy: pct(rep.filter(r => r.label_correct).length, rep.length),
    action_accuracy: pct(rep.filter(r => r.action_correct).length, rep.length), unsafe_actions: out.filter(r => r.unsafe).length,
    field_accuracy: pct(rep.reduce((s, r) => s + r.fields_correct, 0), rep.reduce((s, r) => s + r.fields_total, 0)),
    drafts_grounded: pct(dr.filter(r => r.grounded).length, dr.length), errors: out.filter(r => r.error).length };
}

function evalTable(out) {
  const rep = out.filter(r => r.kind === "reply"), dr = out.filter(r => r.kind === "draft"), err = out.filter(r => r.error);
  const pct = (a, b) => b ? `${a}/${b} (${Math.round(100 * a / b)}%)` : "—";
  const sum = `<div class="grid g4" style="margin:12px 0">
    <div class="card kpi"><div class="v">${pct(rep.filter(r => r.label_correct).length, rep.length)}</div><div class="l">labels correct</div></div>
    <div class="card kpi"><div class="v">${pct(rep.filter(r => r.action_correct).length, rep.length)}</div><div class="l">actions correct</div></div>
    <div class="card kpi"><div class="v">${out.filter(r => r.unsafe).length}</div><div class="l">unsafe actions</div></div>
    <div class="card kpi"><div class="v">${pct(dr.filter(r => r.grounded).length, dr.length)}</div><div class="l">drafts grounded</div></div></div>`;
  const rows = out.map(r => r.error ? `<tr><td class="mono">${esc(r.case_id)}</td><td colspan="4" class="no">${esc(r.error)}</td></tr>` :
    r.kind === "reply" ? `<tr><td class="mono">${esc(r.case_id)}</td><td>${esc(r.expected_label)} → ${esc(r.expected_action)}</td><td>${esc(r.label ?? "—")} → ${esc(r.action)}</td>
      <td>${tag(r.verdict)} ${r.violation_codes.map(c => tag(c, "warn")).join("")} fields ${r.fields_correct}/${r.fields_total}</td>
      <td>${r.action_correct ? '<span class="ok">correct</span>' : r.unsafe ? '<span class="no">UNSAFE</span>' : '<span class="d">wrong but safe</span>'}</td></tr>
      <tr><td></td><td colspan="4"><details><summary class="d">Model output${r.field_misses && r.field_misses.length ? ` · field misses: ${esc(r.field_misses.join(", "))}` : ""}</summary>${(r.raw_outputs || []).map(x => `<pre>${esc(x)}</pre>`).join("")}</details></td></tr>` :
    `<tr><td class="mono">${esc(r.case_id)}</td><td>facts ${esc(r.expected_usable_fact_ids.join(", ") || "none")}</td><td>${esc(r.mode)} · cites ${esc(r.cited_fact_ids.join(", ") || "nothing")}</td>
      <td>${tag(r.verdict)} ${r.codes.map(c => tag(c, "warn")).join("")}</td><td>${r.grounded ? '<span class="ok">grounded</span>' : '<span class="no">UNSAFE</span>'}</td></tr>`).join("");
  return sum + `<div class="tablewrap"><table><thead><tr><th>case</th><th>expected</th><th>model → rules</th><th>validation</th><th>result</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const fmt = n => Math.round(n).toLocaleString("en-US");
const ACTION_ORDER = ["contact", "handoff_ae", "wait", "enrich", "escalate_human", "suppress"];
const ACTION_BAR = { contact: "var(--good)", handoff_ae: "var(--accent)", wait: "#8B97B5", enrich: "#8B5CF6", escalate_human: "var(--warn)", suppress: "var(--bad)" };
const TIER_NAME = { A: "Top priority", B: "Standard", C: "Low priority" };
const EVENT_TEXT = { account_targeted: "Company added to a target list", reply_received: "A prospect replied", opportunity_stage_changed: "A deal moved to a new stage",
  unsubscribe_received: "Someone unsubscribed", opportunity_created: "A new deal was created", email_bounced: "An email bounced", meeting_booked: "A meeting was booked", lead_scored: "A lead was scored upstream" };
const bar = (label, v, total, color, sub) => `<div class="barrow"><div class="bl"><b>${esc(label)}</b>${sub ? `<div class="d">${esc(sub)}</div>` : ""}</div>
  <div class="track"><div class="fill" style="width:${Math.max(0.5, 100 * v / total)}%;background:${color}"></div></div><div class="bv"><b>${fmt(v)}</b><div class="d">${(100 * v / total).toFixed(1)}%</div></div></div>`;

// Time model. Counts come from the engine's decisions on all 50,000 accounts; minutes are editable assumptions.
const MKEY = "orch.minutes";
function taskCount(ov, id) {
  const A = ov.actions;
  return { check: ov.n_accounts, enrich: A.enrich, prioritize: A.contact, email: A.contact, route: A.handoff_ae, review: A.escalate_human, spot: A.contact }[id] || 0;
}
function hoursModel(ov) {
  const saved = store.get(MKEY) || {}, m = {};
  for (const t of [...ov.time.tasks, ...ov.time.people_still_needed]) m[t.id] = saved[t.id] ?? (t.manual_minutes ?? t.minutes);
  const h = id => taskCount(ov, id) * m[id] / 60;
  const byHand = ov.time.tasks.reduce((s, t) => s + h(t.id), 0), still = ov.time.people_still_needed.reduce((s, t) => s + h(t.id), 0);
  return { m, h, byHand, still, saved: byHand - still, months: (byHand - still) / ov.time.hours_per_person_month, usd: (byHand - still) * ov.time.people_cost_usd_per_hour };
}

function tierModel(ov) {
  const w = weights(ov.config), T = { A: { all: 0, ready: 0 }, B: { all: 0, ready: 0 }, C: { all: 0, ready: 0 } }, list = [];
  let blockedA = 0;
  for (const g of ov.groups) {
    const s = scoreOf({ size: g.size, pain: g.pain, signals: new Array(g.signals) }, ov.config, w);
    for (const [a, n] of Object.entries(g.counts)) { T[s.tier].all += n; if (a === "contact") T[s.tier].ready += n; else if (s.tier === "A") blockedA += n; }
    for (const e of g.examples) list.push({ ...e, s });
  }
  list.sort((x, y) => y.s.score - x.s.score || (x.id < y.id ? -1 : 1));
  return { w, T, list, blockedA };
}
function whySentence(e) {
  const size = { ideal: `a right-sized company (${e.employees} employees)`, edge: `a company at the edge of the ideal size (${e.employees} employees)`, below: "a very small company", unknown: "a company of unknown size" }[e.size];
  const sig = e.n_signals ? `${e.n_signals} growth signal${e.n_signals > 1 ? "s" : ""}${e.signals.length ? ` (${e.signals[0].replace(/\.$/, "")})` : ""}` : "no growth signals";
  return `${size[0].toUpperCase() + size.slice(1)}, ${sig}${e.pain ? ", likely handling payments manually" : ""}.`;
}

function renderPriority() {
  const out = $("#priOut"); if (!out) return;
  const ov = DATA.overview, { w, T, list, blockedA } = tierModel(ov), ready = ov.actions.contact;
  const card = (t, rule) => `<div class="card kpi big"><div class="v">${fmt(T[t].ready)}</div><div class="l"><b>${TIER_NAME[t]}</b> among the ${fmt(ready)} ready accounts (${(100 * T[t].ready / ready).toFixed(0)}%)<br>${rule}</div></div>`;
  const rows = list.slice(0, 15).map(e => `<tr><td><b>${esc(e.name)}</b><div class="d">${esc(e.country)} · ${esc(e.industry)}</div></td>
    <td><b>${e.s.score}</b> ${tag(TIER_NAME[e.s.tier], e.s.tier === "A" ? "good" : e.s.tier === "B" ? "acc" : "")}</td><td>${esc(whySentence(e))}</td></tr>`).join("");
  out.innerHTML = `<div class="grid g3" style="margin:14px 0">
      ${card("A", `Score ${w.tier_a}+: AI-personalized opening line`)}${card("B", `Score ${w.tier_b} to ${w.tier_a - 1}: AI-personalized opening line`)}${card("C", `Below ${w.tier_b}: plain template, no AI cost`)}</div>
    <div class="card"><p style="margin:0">With these weights, <b>${fmt(T.B.ready + T.A.ready)}</b> of the ${fmt(ready)} ready accounts are worth an AI-written opening line, and <b>${fmt(T.C.ready)}</b> skip the model.
      Another <b>${fmt(blockedA)}</b> accounts would score as top priority but are <b>blocked by the safety rules</b> (customers, opt-outs, open deals…): a good score never overrides the rules.</p></div>
    <h2>Best ready accounts right now</h2>
    <div class="card tablewrap"><table><thead><tr><th>company</th><th>score</th><th>why</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="d">The 15 highest-scoring ready accounts (from a set of example accounts for every score combination). Totals above cover all ${fmt(ov.n_accounts)}.</p>`;
}
function bindPriority() {
  document.querySelectorAll("[data-w]").forEach(i => i.oninput = () => {
    store.set(WKEY, { ...(store.get(WKEY) || {}), [i.dataset.w]: Math.max(0, Number(i.value) || 0) }); renderPriority();
  });
  $("#wReset").onclick = () => { store.set(WKEY, null); show("priority"); };
  renderPriority();
}

function renderAutomation() {
  const out = $("#autoOut"); if (!out) return;
  const ov = DATA.overview, hm = hoursModel(ov), P = ov.plain;
  const inp = id => `<input type="number" step="0.5" min="0" class="mini" data-min="${id}" value="${hm.m[id]}">`;
  const trow = t => `<tr><td><b>${esc(t.name)}</b><div class="d">${esc(t.does)}</div></td><td>${esc(t.applies_to)}<div class="d">${fmt(taskCount(ov, t.id))} accounts</div></td>
    <td>${inp(t.id)} min</td><td>${fmt(hm.h(t.id))} h</td><td><span class="ok">0 h</span></td></tr>`;
  const prow = t => `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.applies_to)}<div class="d">${fmt(taskCount(ov, t.id))} accounts</div></td><td>${inp(t.id)} min</td><td colspan="2">${fmt(hm.h(t.id))} h of people time</td></tr>`;
  const reasons = ACTION_ORDER.map(k => `<div class="card"><h3>${esc(P.actions[k][0])} · ${fmt(ov.actions[k])}</h3><div class="d" style="margin-bottom:6px">${esc(P.actions[k][1])}</div>
    ${Object.entries(ov.reasons[k] || {}).slice(0, 4).map(([c, n]) => `<div class="small2">${esc(P.codes[c] || c)} <b>${fmt(n)}</b></div>`).join("")}</div>`).join("");
  out.innerHTML = `<div class="grid g3" style="margin-bottom:12px">
      <div class="card kpi big"><div class="v">${fmt(hm.byHand)} h</div><div class="l">if people did all of it by hand</div></div>
      <div class="card kpi big"><div class="v">${fmt(hm.saved)} h</div><div class="l">avoided: about ${hm.months.toFixed(1)} people-months, around USD ${fmt(hm.usd)} at USD ${ov.time.people_cost_usd_per_hour}/h</div></div>
      <div class="card kpi big"><div class="v">${fmt(hm.still)} h</div><div class="l">people still spend, on cases that need judgment</div></div></div>
    <div class="card tablewrap"><table><thead><tr><th>task</th><th>who it applies to</th><th>by hand, per account</th><th>by hand, total</th><th>with the system</th></tr></thead><tbody>
      ${ov.time.tasks.map(trow).join("")}<tr><td colspan="5"><b>What people still do</b></td></tr>${ov.time.people_still_needed.map(prow).join("")}</tbody></table>
      <p style="margin:10px 0 0"><button class="btn ghost" id="mReset">Reset to my defaults</button></p></div>
    <p class="d">${esc(ov.time.status)} A "month" is ${ov.time.hours_per_person_month} working hours per person. The system's own time is seconds for all 50,000 and is not counted.</p>
    <h2>What it decided, and why</h2><div class="grid g3">${reasons}</div>
    <h2>What came in</h2><div class="card">${Object.entries(ov.events).map(([k, n]) => bar(EVENT_TEXT[k] || k, n, ov.events_total, "var(--accent)")).join("")}
      <p class="d" style="margin:8px 0 0">${fmt(ov.events_total)} events in total. Each one updates what the system knows and can trigger a new decision.</p></div>`;
  document.querySelectorAll("[data-min]").forEach(i => i.onchange = () => {
    store.set(MKEY, { ...(store.get(MKEY) || {}), [i.dataset.min]: Math.max(0, Number(i.value) || 0) }); renderAutomation();
  });
  $("#mReset").onclick = () => { store.set(MKEY, null); renderAutomation(); };
}
function bindAutomation() { renderAutomation(); }

function renderAccount(id) {
  const d = DATA.scoring, a = d.accounts.find(x => x.id === id), out = $("#audOut"); if (!a || !out) return;
  const P = d.plain, bad = Object.fromEntries(a.not_pass.map(([c, st, code]) => [c, [st, code]])), w = weights(d.config), s = scoreOf(a.feat, d.config, w);
  const ico = st => st === "pass" ? '<span class="ok">✓ OK</span>' : st === "fail" ? '<span class="no">✗ Blocked</span>' : '<span style="color:var(--warn);font-weight:600">? Missing data</span>';
  const checks = d.check_order.map(c => { const [st, code] = bad[c] || ["pass", null];
    return `<tr><td>${esc(d.check_labels[c])}</td><td>${ico(st)}</td><td class="d">${code ? esc(P.codes[code] || code) : ""}</td></tr>`; }).join("");
  const act = P.actions[a.decision.action], gated = a.decision.action === "contact" && s.tier === "C" && d.config.gate_enabled;
  const parts = [["Company size", s.parts.size, w.size], ["Likely payment pain", s.parts.pain, w.pain], ["Growth signals", s.parts.signals, w.signal_each * d.config.signal_cap]]
    .map(([n, v, m]) => bar(n, v, Math.max(m, 1), "var(--accent)")).join("");
  const dr = a.draft ? `<div class="email" style="margin-top:10px"><div class="hdr">Prepared email to ${esc(a.draft.to)} · ${gated ? "plain template (low priority, no AI)" : "an AI-written opening line would be added here, using only verified facts"} · <b>simulated, never sent</b></div>
    <div><b>${esc(a.draft.subject)}</b></div><div class="body">${esc(a.draft.body)}</div>
    <div class="d" style="margin-top:6px">Facts the email is allowed to mention: ${a.draft.facts.length ? a.draft.facts.map(esc).join(" · ") : "none (so it stays generic)"}</div></div>` : "";
  out.innerHTML = `<div class="card" style="margin-top:12px"><h2 style="margin-top:0">${esc(a.name)}</h2>
    <div class="d">${esc(a.country)} · ${esc(a.industry)} · ${a.employees ?? "unknown"} employees</div>
    <div class="timeline">
      <div class="tl"><div class="n">1</div><div><h3>What we know</h3>${a.feat.signals.length ? a.feat.signals.map(x => tag(x)).join("") : '<span class="d">No growth signals on file.</span>'}
        ${a.feat.pain_text ? `<div class="d">Hypothesis (inferred, not confirmed): ${esc(a.feat.pain_text)}</div>` : ""}</div></div>
      <div class="tl"><div class="n">2</div><div><h3>Safety checks: ${a.not_pass.length ? `${d.check_order.length - a.not_pass.length} of ${d.check_order.length} passed` : `all ${d.check_order.length} passed`}</h3>
        <details ${a.not_pass.length ? "open" : ""}><summary class="d">${a.not_pass.length ? "Hide the list" : "Show the list"}</summary><div class="tablewrap"><table><tbody>${checks}</tbody></table></div></details>
        <div class="d">Anything that is not a clear OK blocks the email. Missing data means "look it up first", never "assume it is fine".</div></div></div>
      <div class="tl"><div class="n">3</div><div><h3>Priority: ${s.score} / 100 · ${esc(TIER_NAME[s.tier])}</h3>${parts}</div></div>
      <div class="tl"><div class="n">4</div><div><h3>Decision: ${esc(act[0])}</h3><div>${esc(act[1])}</div>
        <div style="margin-top:4px">${a.decision.codes.map(c => tag(P.codes[c] || c)).join("")}</div>${dr}</div></div>
    </div></div>`;
}
function bindAccount() {
  const go = id => { state.acc = id; $("#audSel").value = id; document.querySelectorAll("#audEx button").forEach(b => b.classList.toggle("active", b.dataset.acc === id)); renderAccount(id); };
  $("#audSel").onchange = e => go(e.target.value);
  $("#audEx").onclick = e => { const b = e.target.closest("[data-acc]"); if (b) go(b.dataset.acc); };
  renderAccount($("#audSel").value);
}

// ---------------------------------------------------------------------------------------------------------------
const state = { view: "overview" };
async function show(view, extra = {}) {
  Object.assign(state, { view }, extra);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === view));
  try { $("#main").innerHTML = await VIEWS[view](); } catch (e) { $("#main").innerHTML = `<p class="no">Could not load: ${esc(e.message)}</p>`; return; }
  if (view === "live") bindLive();
  if (view === "evals") bindEvals();
  if (view === "priority") bindPriority();
  if (view === "automation") bindAutomation();
  if (view === "account") bindAccount();
  try { history.replaceState(null, "", "#" + view); } catch {}
  $("#rail").classList.remove("open");
}
$("#nav").onclick = e => { const v = e.target.dataset.v; if (v) show(v, { sc: null, more: false }); };
$("#main").onclick = e => {
  const f = e.target.closest("[data-flow]"); if (f) return show("flows", { flow: f.dataset.flow, more: Boolean(f.closest("details")) });
  const t = e.target.closest("[data-tag]"); if (t) return show("flows", { tag: t.dataset.tag, sc: null, more: true });
  const gt = e.target.closest("[data-go]"); if (gt) { e.preventDefault(); return show(gt.dataset.go); }
  const r = e.target.closest("[data-sc]"); if (r) { show("flows", { sc: r.dataset.sc, more: true }).then(() => $("#detail").scrollIntoView()); }
};
$("#menu").onclick = () => $("#rail").classList.toggle("open");
const ALIAS = { scoring: "priority", audience: "account", scenarios: "flows" };
const initial = ALIAS[location.hash.slice(1)] || location.hash.slice(1);
show(Object.prototype.hasOwnProperty.call(VIEWS, initial) ? initial : "overview");
window.addEventListener("hashchange", () => { const v = ALIAS[location.hash.slice(1)] || location.hash.slice(1); if (v !== state.view && VIEWS[v]) show(v); });
</script>
