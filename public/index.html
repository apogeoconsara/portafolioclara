/* ------------------------------------------------------------------- 8. CHAT */
let chatMessages = []; // formato Anthropic (Messages API), lo dueño el cliente
let chatPendingApproval = null;

function renderAgentChat() {
  const wrap = el(`<div>
    <div class="page-head"><h1>Agente Clara (Demo)</h1><p>Chatea en español sobre las empresas reales del dataset (investigadas con Clay). El agente usa Claude (Anthropic) con tool-use real — puede listar, consultar y calificar leads, y solo con tu aprobación explícita puede proponer guardar una decisión en el CRM (simulado). Ninguna de estas empresas ha sido contactada; esto no es una campaña activa de Clara.</p></div>
    <div class="panel">
      <div class="chat-wrap">
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Ej: ¿a qué lead debería contactar primero esta semana?" />
          <button class="btn" id="chat-send">Enviar</button>
        </div>
      </div>
    </div>
  </div>`);

  const log = wrap.querySelector("#chat-log");
  function addBubble(role, text) {
    log.appendChild(el(`<div class="chat-msg ${role}">${esc(text)}</div>`));
    log.scrollTop = log.scrollHeight;
  }
  function addSystem(text) {
    log.appendChild(el(`<div class="chat-msg system">${esc(text)}</div>`));
    log.scrollTop = log.scrollHeight;
  }
  function addTyping() {
    const node = el(`<div class="chat-msg agent" id="typing-indicator"><span class="typing-dots"><span></span><span></span><span></span></span></div>`);
    log.appendChild(node); log.scrollTop = log.scrollHeight;
    return node;
  }
  function renderExisting() {
    log.innerHTML = "";
    if (chatMessages.length === 0) addSystem("Este chat es un ejercicio de portafolio y solo conoce las empresas reales del dataset de este demo (ninguna ha sido contactada).");
    chatMessages.forEach(m => {
      if (m.role === "user" && typeof m.content === "string") addBubble("user", m.content);
      if (m.role === "assistant") {
        const text = (m.content || []).filter(b => b.type === "text").map(b => b.text).join(" ");
        if (text) addBubble("agent", text);
      }
    });
    if (chatPendingApproval) renderApprovalCard();
  }
  function renderApprovalCard() {
    const p = chatPendingApproval.input;
    const card = el(`<div class="chat-approval">
      <b>Solicitud de aprobación — acción de CRM</b><br>
      Lead: ${esc(p.nombre)}<br>Score: ${p.score} · Tier ${esc(p.tier)}<br>Acción: ${esc(p.ruteo)}<br>
      Mensaje: <span style="white-space:pre-wrap">${esc(p.mensaje)}</span>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn" id="approve-btn">Aprobar</button>
        <button class="btn danger" id="reject-btn">Rechazar</button>
      </div>
    </div>`);
    log.appendChild(card); log.scrollTop = log.scrollHeight;
    card.querySelector("#approve-btn").addEventListener("click", () => resolveApproval(true));
    card.querySelector("#reject-btn").addEventListener("click", () => resolveApproval(false));
  }

  async function sendMessage(text) {
    chatMessages.push({ role: "user", content: text });
    addBubble("user", text);
    const typing = addTyping();
    try {
      const res = await fetch("/.netlify/functions/clara-agent-chat", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: chatMessages }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) { addSystem("Error: " + (data.error || ("HTTP " + res.status))); return; }
      chatMessages = data.messages;
      CALL_LOG.push({ ts: new Date().toISOString(), system: "Anthropic (clara-agent-chat)", lead: "", status: "ok" });
      const last = chatMessages[chatMessages.length - 1];
      const text2 = last.role === "assistant" ? (last.content || []).filter(b=>b.type==="text").map(b=>b.text).join(" ") : "";
      if (text2) addBubble("agent", text2);
      if (data.pending_approval) {
        chatPendingApproval = { ...data.pending_approval, heldToolResults: data.held_tool_results };
        renderApprovalCard();
      } else if (data.limit_reached) {
        addSystem("Se alcanzó el límite de pasos de este demo — recarga la página para empezar de nuevo.");
      }
    } catch (err) {
      typing.remove();
      addSystem("No se pudo contactar al agente (" + String(err.message || err) + ").");
    }
  }

  async function resolveApproval(approved) {
    const pending = chatPendingApproval;
    chatPendingApproval = null;
    document.querySelectorAll(".chat-approval .btn-row").forEach(r => r.remove());
    addSystem(approved ? "Aprobado por ti." : "Rechazado por ti.");
    let confirmMsg = null;
    if (approved) {
      try {
        const res = await fetch("/.netlify/functions/confirm-crm-action", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: pending.input }),
        });
        const data = await res.json();
        confirmMsg = data.message;
        CALL_LOG.push({ ts: new Date().toISOString(), system: "confirm-crm-action", lead: pending.input.nombre, status: data.status });
        addSystem(confirmMsg || "Acción simulada.");
      } catch (err) {
        addSystem("No se pudo confirmar la acción (" + String(err.message || err) + ").");
      }
    }
    const toolResult = {
      type: "tool_result", tool_use_id: pending.tool_use_id,
      content: approved ? "Aprobado por el humano. " + (confirmMsg || "Acción simulada, nunca se escribió en un sistema real.") : "Rechazado por el humano — no se realiza ninguna acción.",
    };
    const merged = [...pending.heldToolResults, toolResult];
    chatMessages.push({ role: "user", content: merged });
    const typing = addTyping();
    try {
      const res = await fetch("/.netlify/functions/clara-agent-chat", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: chatMessages }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) { addSystem("Error: " + (data.error || ("HTTP " + res.status))); return; }
      chatMessages = data.messages;
      const last = chatMessages[chatMessages.length - 1];
      const text2 = last.role === "assistant" ? (last.content || []).filter(b=>b.type==="text").map(b=>b.text).join(" ") : "";
      if (text2) addBubble("agent", text2);
    } catch (err) {
      typing.remove();
      addSystem("No se pudo continuar la conversación (" + String(err.message || err) + ").");
    }
  }

  wrap.querySelector("#chat-send").addEventListener("click", () => {
    const input = wrap.querySelector("#chat-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendMessage(text);
  });
  wrap.querySelector("#chat-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") wrap.querySelector("#chat-send").click();
  });

  renderExisting();
  return wrap;
}

init();
</script>
</body>
</html>
